<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Otaq · Çimizdirmə — ayrıca tam ekran hamam.
       Aşağıdakı qaydalar tətbiqin app.css/pet.css-indən OLDUĞU KİMİ köçürülüb
       (əl ilə yazılmayıb). Tətbiqin həmin bölmələri dəyişəndə bu artboard da
       yenidən qurulmalıdır — kanvas kodu güzgüləyir. */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* theme.css-in element sıfırlamaları: onsuz düymələr brauzerin öz çərçivəsi
       ilə çıxır (məsələn oyun avtomatının arxasında ağ qutu). */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    img,
    svg { max-width: 100%; display: block; }

    :root {
        /* Brend */
        --pp-primary: #6F5AD8;
        --pp-primary-dark: #54419E;
        --pp-primary-soft: #E9E4F7;
    
        /* ---- Üç rəng ailəsi ----
         * Hər ailənin bir işi var, ona görə oxumağı hələ yaxşı bacarmayan uşaq da
         * ekranda nə baş verdiyini rəngdən anlayır:
         *
         *   bənövşəyi — ağıl      : brend, öyrənmə, gem, əsas düymələr
         *   yaşıl     — canlılıq  : pet, dünya, doğru cavab, sağlam statlar
         *   narıncı   — enerji    : ulduz, seriya, mini oyunlar, kəşf
         *
         * Səhv rəngi qəsdən moruğa çalır. Narıncı "qazandın" deməkdir, ona görə
         * səhv ondan aydın seçilməlidir: köhnə mərcan (#FF7A6B) narıncıya cəmi
         * ~14° yaxın idi, moruq isə ~45° aralıdır.
         */
    
        /* Yaşıl — canlılıq */
        --pp-life: #35A57A;
        --pp-life-deep: #156F4F;   /* ağ mətn daşıya bilən yeganə yaşıl — 6.1:1 */
        --pp-life-soft: #DCEEE4;
        --pp-on-life: #06301D;     /* parlaq yaşıl dolgunun üstündəki mətn */
    
        /* Narıncı — enerji */
        --pp-spark: #E89A3C;
        --pp-spark-deep: #93540E;  /* açıq fonda narıncı mətn — 5.0:1 */
        --pp-spark-soft: #FAEBD6;
        --pp-on-spark: #3A1D00;    /* narıncının üstündə ağ mətn 2.3:1 verir — istifadə olunmur */
    
        /* Moruq — yalnız səhv */
        --pp-alert: #B7304C;
        --pp-alert-soft: #F7E1E5;
        --pp-on-alert: #FFFFFF;
    
        /* Səthlər */
        --pp-bg: #F0EBE0;
        --pp-card: #FBF7EF;
        --pp-card-soft: #F6F1E6;
        --pp-overlay: rgba(38, 30, 18, 0.58);
    
        /* Mətn */
        --pp-ink: #241E38;
        --pp-ink-soft: #5C5470;
        --pp-ink-muted: #8A82A0;
        --pp-on-primary: #FFFFFF;
    
        /* Sərhəd */
        --pp-border: #E4DCCE;
        --pp-track: #E8E2D6;
    
        /* Kölgə — rəngli, "oyuncaq" hissi verir */
        --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
        --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
        --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
    
        /* ---- Səth resepti ----
         * Mobil oyun düymələri düz dolğu deyil: yuxarısı işıqlı ("lift"), altında
         * isə bir neçə piksellik tünd kənar ("edge") var — həmin kənar düymənin
         * qalınlığıdır və basılanda azalır, ona görə element fiziki hiss olunur.
         * Yeni rəng ailəsi əlavə olunmur; hər dəyər mövcud ailənin çalarıdır.
         */
        --pp-primary-lift: #8A78E4;
        --pp-primary-edge: #4E3BA8;
        --pp-life-lift: #4FBB91;
        --pp-life-edge: #156F4F;
        --pp-spark-lift: #F2B166;
        --pp-spark-edge: #93540E;
        --pp-alert-lift: #C94764;
        --pp-alert-edge: #8A2038;
    
        /* Neytral səthlərin (kart, kapsul, dok) kənarı — rəngsiz, sadəcə dərinlik. */
        --pp-edge-neutral: rgba(96, 74, 46, 0.20);
    
        /* Üst kənardakı işıq zolağı — plastik parıltı hissi. */
        --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);
    
        /* Forma */
        --pp-radius-sm: 14px;
        --pp-radius: 22px;
        --pp-radius-lg: 30px;
        --pp-radius-pill: 999px;
    
        /* Ölçü */
        --pp-tap: 56px;
        --pp-gutter: 18px;
    
        /* Cihaz safe-area */
        --pp-safe-top: env(safe-area-inset-top, 0px);
        --pp-safe-bottom: env(safe-area-inset-bottom, 0px);
    
        color-scheme: light;
    }
    }

    .pp-root {
      --pp-safe-top: 0px;
      --pp-safe-bottom: 0px;
    }

    /* ==================== PET AVATAR ====================
     * Pet tamamilə inline SVG-dir — xarici asset yoxdur, ölçüdən asılı olmayaraq
     * kəskin görünür və mərhələ/əhval dəyişəndə anında yenilənir.
     * ==================================================== */
    
    .pet {
        width: min(210px, 62vw);
        height: auto;
        transform-origin: 50% 92%;
        animation: pet-breathe 3.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 14px rgba(60, 40, 20, 0.22));
    }
    
    .pet--excited { animation: pet-hop 900ms cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
    .pet--sad,
    .pet--sleepy { animation: pet-slow-breathe 5s ease-in-out infinite; }
    .pet--hungry { animation: pet-wobble 2.4s ease-in-out infinite; }
    
    /* Quyruq həmişə yüngülcə tərpənir — pet "canlı" görünsün. */
    .pet__tail {
        transform-origin: 68% 72%;
        animation: pet-wag 1.9s ease-in-out infinite;
    }
    
    .pet--excited .pet__tail { animation-duration: 700ms; }
    .pet--sad .pet__tail,
    .pet--sleepy .pet__tail { animation-duration: 4s; }
    
    /* Göz qırpma — nadir və qısa, diqqəti yayındırmır. */
    .pet__eyelid {
        transform-origin: center;
        animation: pet-blink 5.5s ease-in-out infinite;
    }
    
    .pet--sleepy .pet__eyelid { animation: none; }
    
    .pet__zzz {
        animation: pet-float 2.6s ease-in-out infinite;
    }
    
    .pet__sparkle {
        transform-origin: center;
        animation: pet-sparkle 1.8s ease-in-out infinite;
    }
    
    .pet-stage-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 14px;
        border-radius: var(--pp-radius-pill);
        background: rgba(255, 255, 255, 0.85);
        color: #3B2A66;
        font-size: 12px;
        font-weight: 800;
    }
    
    /* Yaş nişanın içində ayrıca kapsuldur: mərhələ adı ilə rəqəm bir-birinə
       qarışmasın deyə. */
    .pet-stage-label__age {
        padding: 2px 8px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-primary-soft);
        color: var(--pp-primary-dark);
        font-size: 11px;
        font-weight: 900;
    }
    
    @keyframes pet-breathe {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        50% { transform: scaleY(1.025) scaleX(0.99); }
    }
    
    @keyframes pet-slow-breathe {
        0%, 100% { transform: scaleY(1) translateY(0); }
        50% { transform: scaleY(0.985) translateY(3px); }
    }
    
    @keyframes pet-hop {
        0%, 100% { transform: translateY(0) scaleY(1); }
        35% { transform: translateY(-14px) scaleY(1.04); }
        55% { transform: translateY(0) scaleY(0.94); }
        70% { transform: translateY(0) scaleY(1); }
    }
    
    @keyframes pet-wobble {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-2.5deg); }
        70% { transform: rotate(2.5deg); }
    }
    
    @keyframes pet-wag {
        0%, 100% { transform: rotate(-7deg); }
        50% { transform: rotate(9deg); }
    }
    
    @keyframes pet-blink {
        0%, 92%, 100% { transform: scaleY(0); }
        94%, 97% { transform: scaleY(1); }
    }
    
    @keyframes pet-float {
        0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(10px, -22px) scale(1.1); }
    }
    
    @keyframes pet-sparkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    
    /* Yumurta mərhələsi — hələ "yatır", yalnız yüngül tərpənir. */
    .pet--egg {
        animation: pet-egg-rock 3s ease-in-out infinite;
    }
    
    @keyframes pet-egg-rock {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
    }
    
    /* ---------- Bədənin rəngləri ----------
       Rəsm bir dənədir, rəng isə növdən gəlir: PetAvatar SVG-nin üstündə
       --pet-fur / --pet-belly / --pet-inner-ear dəyişənlərini qoyur, ona görə
       eyni yol dörd növə (tülkü, pişik, əjdaha, dovşan) xidmət edir. */
    .pet__fur { fill: var(--pet-fur, #F3A05A); }
    .pet__belly { fill: var(--pet-belly, #FFF3E2); }
    .pet__inner-ear { fill: var(--pet-inner-ear, #FFD3A8); }
    
    /* Kontur bütün mərhələlərdə eyni qalınlıqdadır — kiçik ölçüdə forma
       yumşalmasın deyə. */
    .pet__outline {
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    .pet__eye,
    .pet__nose { fill: #2B2140; }
    
    .pet__mouth {
        fill: none;
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yumulmuş və gülən gözlər xətdir, dolgu deyil. */
    .pet__lash {
        fill: none;
        stroke: #2B2140;
        stroke-width: 4;
        stroke-linecap: round;
    }
    
    /* Tam ekran otaqlarda pet öz qutusunu doldurur. Standart `.pet` eni
       `min(210px, 62vw)`-dir — səhnə üçün doğrudur, amma otaqda qutunun ölçüsünü
       səhnə özü seçir (güzgünün qarşısı, vanna, yataq) və pet həmin qutuya
       oturmalıdır, yoxsa sola sürüşür və ya qutudan daşır. */
    .bathroom__pet .pet,
    .bedroom__pet .pet,
    .closet__pet .pet {
        width: 100%;
        max-width: none;
    }
    
    /* Növə xas detallar: tülkünün qulaq ucları, pişik və dovşanın bığları.
       Bunlar tükün rəngindən asılı deyil — həmişə tünd, çünki siluetin oxunması
       onlardan asılıdır. */
    .pet__ear-tip { fill: #2B2140; }
    
    .pet__whisker {
        fill: none;
        stroke: #2B2140;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yalnız konturla çəkilən formalar (əjdahanın silsiləsi, dovşanın qulaq
       cizgiləri) və dovşanın ön dişləri. */
    .pet__line { fill: none; }
    
    .pet__tooth {
        stroke: #2B2140;
        stroke-width: 1.4;
        stroke-linejoin: round;
    }
    

    .progress {
        height: 14px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-track);
        overflow: hidden;
    }
    
    .progress__bar {
        height: 100%;
        border-radius: var(--pp-radius-pill);
        background: linear-gradient(90deg, var(--pp-primary) 0%, var(--pp-primary-dark) 100%);
        transition: width 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .progress__bar--water {
        background: linear-gradient(90deg, #4FC3F7 0%, #2196C4 100%);
    }
    
    .progress--goal .progress__bar {
        background: linear-gradient(90deg, #FFB454 0%, var(--pp-spark) 100%);
    }
    
    .progress__row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-weight: 800;
        font-size: 14px;
    }
    
    .overlay-close {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--pp-card) 0%, var(--pp-card-soft) 100%);
        border: 3px solid var(--pp-border);
        box-shadow: 0 4px 0 var(--pp-edge-neutral), var(--pp-shadow-md);
        font-size: 20px;
        font-weight: 900;
        color: var(--pp-ink);
        transition: transform 130ms ease, box-shadow 130ms ease;
    }
    
    .overlay-close:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
    }
    
    .bath__suds {
        position: absolute;
        pointer-events: none;
        transition: opacity 600ms ease, transform 600ms ease;
    }
    
    .bath__suds--rinsing { opacity: 0; transform: translateY(30px); }
    
    .bathroom {
        --bt-water-pale: #BFE9FF;
        --bt-water-mid: #7FD3F7;
        --bt-water-bright: #4FC3F7;
        --bt-water-deep: #2196C9;
        --bt-foam: #FFFFFF;
        --bt-tile: #EAF6FB;
        --bt-tile-alt: #D8EEF8;
        --bt-grout: #C7E3F0;
    
        position: absolute;
        inset: 0;
        z-index: 60;
        overflow: hidden;
        background-color: var(--bt-tile);
        animation: pp-closet-in 220ms ease-out;
    }
    
    .bathroom__room {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 390px;
        height: 620px;
        /* Miqyas JS-dən gəlir (petCare.js → fitRooms): otaq ekranı doldurur,
           nisbət qorunur, artıq hissə kəsilir. Origin aşağıdadır ki, döşəmə
           həmişə ekranın altında qalsın. */
        transform: translateX(-50%) scale(var(--room-scale, 1));
        transform-origin: bottom center;
    }
    
    .bathroom__decor,
    .bathroom__front {
        position: absolute;
        inset: 0;
        isolation: isolate;
        pointer-events: none;
    }
    
    .bathroom__decor { z-index: 0; }
    
    .bathroom__front { z-index: 3; }
    
    .bathroom__pet {
        position: absolute;
        left: 50%;
        bottom: 26%;
        width: 260px;
        z-index: 2;
        transform: translateX(-50%);
    }
    
    .bathroom__tools {
        position: absolute;
        left: var(--pp-gutter);
        right: var(--pp-gutter);
        bottom: calc(14px + var(--pp-safe-bottom));
        z-index: 5;
        display: grid;
        justify-items: center;
        gap: 9px;
        /* Alət paneli vannanın üstündə üzür, ona görə öz səthi var: onsuz
           gedişat zolağı suyun üstündə asılmış xətt kimi oxunurdu. */
        padding: 12px 14px 14px;
        border-radius: 28px;
        background: rgba(251, 247, 239, 0.93);
        box-shadow: var(--pp-shadow-md);
    }
    
    .bathroom__hint {
        padding: 9px 16px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-card);
        color: var(--pp-ink);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
        box-shadow: var(--pp-shadow-sm);
    }
    
    .bathroom__bar {
        position: absolute;
        top: calc(12px + var(--pp-safe-top));
        left: var(--pp-gutter);
        z-index: 5;
    }
    
    .bath__fx {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
    
    .bath__fx--washed {
        animation: bath-fx-away 420ms ease forwards;
    }
    
    @keyframes bath-fx-away {
        to { opacity: 0; transform: translate(-50%, calc(-50% + 26px)) scale(0.68); }
    }
    
    .bath__ghost-stream {
        --fx-height: 108px;
        position: absolute;
        left: 50%;
        top: 74%;
        transform: translateX(-50%);
        pointer-events: none;
    }
    
    .bath__wall {
        position: absolute;
        z-index: 0;
        /* Divar otaq qutusundan 700px YUXARI uzanır: ekran hündür olanda
           tavan yerində düz rəng qalmasın, kafel davam etsin. Artıq hissəni
           .bathroom-un overflow-u kəsir. */
        inset: -700px 0 174px;
        background-color: var(--bt-tile);
        background-image:
            linear-gradient(to right,
                rgba(255, 255, 255, 0) 56px,
                var(--bt-grout) 56px,
                var(--bt-grout) 58px,
                rgba(255, 255, 255, 0) 58px),
            linear-gradient(to bottom,
                rgba(255, 255, 255, 0) 48px,
                var(--bt-grout) 48px,
                var(--bt-grout) 50px,
                rgba(255, 255, 255, 0) 50px),
            linear-gradient(135deg, var(--bt-tile), var(--bt-tile-alt));
        background-size: 58px 50px, 58px 50px, 100% 100%;
    }
    
    .bath__wall::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg,
            rgba(255, 255, 255, 0.58),
            rgba(255, 255, 255, 0) 38%,
            rgba(255, 255, 255, 0.28));
        content: "";
    }
    
    .bath__baseboard {
        position: absolute;
        z-index: 1;
        top: 431px;
        left: 0;
        width: 100%;
        height: 17px;
        border-top: 2px solid var(--bt-grout);
        border-bottom: 2px solid var(--pp-border);
        background: var(--pp-primary-soft);
    }
    
    .bath__floor {
        position: absolute;
        z-index: 0;
        inset: 446px 0 0;
        background-color: var(--pp-card);
        background-image:
            repeating-linear-gradient(90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0) 72px,
                var(--pp-border) 72px,
                var(--pp-border) 74px),
            repeating-linear-gradient(0deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0) 54px,
                var(--pp-border) 54px,
                var(--pp-border) 56px),
            linear-gradient(135deg, var(--pp-card), var(--pp-bg));
        transform-origin: top center;
    }
    
    .bath__hook {
        position: absolute;
        z-index: 3;
        /* Divardakı əşyalar 60px yuxarı: otaq ekranın altına yapışdırıldığı
           üçün onlar çox aşağıda qalırdı. */
        top: 26px;
        left: 39px;
        width: 22px;
        height: 22px;
        border: 5px solid var(--pp-primary-soft);
        border-radius: 50%;
        background: var(--pp-primary);
        box-shadow: 0 4px 10px rgba(96, 74, 46, 0.13);
    }
    
    .bath__hook::after {
        position: absolute;
        top: 11px;
        left: 4px;
        width: 5px;
        height: 20px;
        border-radius: 5px;
        background: var(--pp-ink-soft);
        content: "";
    }
    
    .bath__towel {
        position: absolute;
        z-index: 2;
        top: 52px;
        left: 16px;
        width: 47px;
        height: 124px;
        border: 3px solid var(--pp-primary);
        border-radius: 13px 13px 18px 18px;
        background: var(--pp-primary-lift);
        clip-path: polygon(0 0, 100% 0, 94% 91%, 82% 100%, 67% 94%, 50% 100%, 34% 94%, 17% 100%, 5% 91%);
        box-shadow: 0 8px 16px rgba(96, 74, 46, 0.13);
    }
    
    .bath__towel::before,
    .bath__towel::after {
        position: absolute;
        top: 8px;
        bottom: 10px;
        width: 5px;
        border-radius: 5px;
        background: var(--pp-primary-soft);
        opacity: 0.55;
        content: "";
    }
    
    .bath__towel::before {
        left: 10px;
    }
    
    .bath__towel::after {
        right: 10px;
    }
    
    .bath__hose {
        position: absolute;
        z-index: 2;
        top: -25px;
        right: -26px;
        width: 91px;
        height: 356px;
        border: 5px solid var(--pp-ink-soft);
        border-left-color: rgba(255, 255, 255, 0);
        border-radius: 50%;
        transform: rotate(-4deg);
        box-shadow: 5px 2px 10px rgba(96, 74, 46, 0.10);
    }
    
    .bath__hose::after {
        position: absolute;
        right: 25px;
        bottom: -11px;
        width: 14px;
        height: 21px;
        border: 4px solid var(--pp-ink-soft);
        border-radius: 7px;
        background: var(--pp-primary-soft);
        content: "";
    }
    
    .bath__shower-head {
        position: absolute;
        z-index: 10;
        top: 17px;
        right: 47px;
        width: 59px;
