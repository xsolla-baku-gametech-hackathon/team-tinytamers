<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Şkaf — ayrıca tam ekran paltar dəyişmə otağı.
       Aşağıdakı qaydalar tətbiqin app.css/pet.css-indən OLDUĞU KİMİ köçürülüb
       (əl ilə yazılmayıb). Tətbiqin həmin bölmələri dəyişəndə bu artboard da
       yenidən qurulmalıdır — kanvas kodu güzgüləyir. */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* theme.css-in element sıfırlamaları: onsuz düymələr brauzerin öz çərçivəsi
       ilə çıxır (məsələn oyun avtomatının arxasında ağ qutu). */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    img,
    svg { max-width: 100%; display: block; }

    :root {
        /* Brend */
        --pp-primary: #6F5AD8;
        --pp-primary-dark: #54419E;
        --pp-primary-soft: #E9E4F7;
    
        /* ---- Üç rəng ailəsi ----
         * Hər ailənin bir işi var, ona görə oxumağı hələ yaxşı bacarmayan uşaq da
         * ekranda nə baş verdiyini rəngdən anlayır:
         *
         *   bənövşəyi — ağıl      : brend, öyrənmə, gem, əsas düymələr
         *   yaşıl     — canlılıq  : pet, dünya, doğru cavab, sağlam statlar
         *   narıncı   — enerji    : ulduz, seriya, mini oyunlar, kəşf
         *
         * Səhv rəngi qəsdən moruğa çalır. Narıncı "qazandın" deməkdir, ona görə
         * səhv ondan aydın seçilməlidir: köhnə mərcan (#FF7A6B) narıncıya cəmi
         * ~14° yaxın idi, moruq isə ~45° aralıdır.
         */
    
        /* Yaşıl — canlılıq */
        --pp-life: #35A57A;
        --pp-life-deep: #156F4F;   /* ağ mətn daşıya bilən yeganə yaşıl — 6.1:1 */
        --pp-life-soft: #DCEEE4;
        --pp-on-life: #06301D;     /* parlaq yaşıl dolgunun üstündəki mətn */
    
        /* Narıncı — enerji */
        --pp-spark: #E89A3C;
        --pp-spark-deep: #93540E;  /* açıq fonda narıncı mətn — 5.0:1 */
        --pp-spark-soft: #FAEBD6;
        --pp-on-spark: #3A1D00;    /* narıncının üstündə ağ mətn 2.3:1 verir — istifadə olunmur */
    
        /* Moruq — yalnız səhv */
        --pp-alert: #B7304C;
        --pp-alert-soft: #F7E1E5;
        --pp-on-alert: #FFFFFF;
    
        /* Səthlər */
        --pp-bg: #F0EBE0;
        --pp-card: #FBF7EF;
        --pp-card-soft: #F6F1E6;
        --pp-overlay: rgba(38, 30, 18, 0.58);
    
        /* Mətn */
        --pp-ink: #241E38;
        --pp-ink-soft: #5C5470;
        --pp-ink-muted: #8A82A0;
        --pp-on-primary: #FFFFFF;
    
        /* Sərhəd */
        --pp-border: #E4DCCE;
        --pp-track: #E8E2D6;
    
        /* Kölgə — rəngli, "oyuncaq" hissi verir */
        --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
        --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
        --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
    
        /* ---- Səth resepti ----
         * Mobil oyun düymələri düz dolğu deyil: yuxarısı işıqlı ("lift"), altında
         * isə bir neçə piksellik tünd kənar ("edge") var — həmin kənar düymənin
         * qalınlığıdır və basılanda azalır, ona görə element fiziki hiss olunur.
         * Yeni rəng ailəsi əlavə olunmur; hər dəyər mövcud ailənin çalarıdır.
         */
        --pp-primary-lift: #8A78E4;
        --pp-primary-edge: #4E3BA8;
        --pp-life-lift: #4FBB91;
        --pp-life-edge: #156F4F;
        --pp-spark-lift: #F2B166;
        --pp-spark-edge: #93540E;
        --pp-alert-lift: #C94764;
        --pp-alert-edge: #8A2038;
    
        /* Neytral səthlərin (kart, kapsul, dok) kənarı — rəngsiz, sadəcə dərinlik. */
        --pp-edge-neutral: rgba(96, 74, 46, 0.20);
    
        /* Üst kənardakı işıq zolağı — plastik parıltı hissi. */
        --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);
    
        /* Forma */
        --pp-radius-sm: 14px;
        --pp-radius: 22px;
        --pp-radius-lg: 30px;
        --pp-radius-pill: 999px;
    
        /* Ölçü */
        --pp-tap: 56px;
        --pp-gutter: 18px;
    
        /* Cihaz safe-area */
        --pp-safe-top: env(safe-area-inset-top, 0px);
        --pp-safe-bottom: env(safe-area-inset-bottom, 0px);
    
        color-scheme: light;
    }
    }

    .pp-root {
      --pp-safe-top: 0px;
      --pp-safe-bottom: 0px;
    }

    /* ==================== PET AVATAR ====================
     * Pet tamamilə inline SVG-dir — xarici asset yoxdur, ölçüdən asılı olmayaraq
     * kəskin görünür və mərhələ/əhval dəyişəndə anında yenilənir.
     * ==================================================== */
    
    .pet {
        width: min(210px, 62vw);
        height: auto;
        transform-origin: 50% 92%;
        animation: pet-breathe 3.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 14px rgba(60, 40, 20, 0.22));
    }
    
    .pet--excited { animation: pet-hop 900ms cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
    .pet--sad,
    .pet--sleepy { animation: pet-slow-breathe 5s ease-in-out infinite; }
    .pet--hungry { animation: pet-wobble 2.4s ease-in-out infinite; }
    
    /* Quyruq həmişə yüngülcə tərpənir — pet "canlı" görünsün. */
    .pet__tail {
        transform-origin: 68% 72%;
        animation: pet-wag 1.9s ease-in-out infinite;
    }
    
    .pet--excited .pet__tail { animation-duration: 700ms; }
    .pet--sad .pet__tail,
    .pet--sleepy .pet__tail { animation-duration: 4s; }
    
    /* Göz qırpma — nadir və qısa, diqqəti yayındırmır. */
    .pet__eyelid {
        transform-origin: center;
        animation: pet-blink 5.5s ease-in-out infinite;
    }
    
    .pet--sleepy .pet__eyelid { animation: none; }
    
    .pet__zzz {
        animation: pet-float 2.6s ease-in-out infinite;
    }
    
    .pet__sparkle {
        transform-origin: center;
        animation: pet-sparkle 1.8s ease-in-out infinite;
    }
    
    .pet-stage-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 14px;
        border-radius: var(--pp-radius-pill);
        background: rgba(255, 255, 255, 0.85);
        color: #3B2A66;
        font-size: 12px;
        font-weight: 800;
    }
    
    /* Yaş nişanın içində ayrıca kapsuldur: mərhələ adı ilə rəqəm bir-birinə
       qarışmasın deyə. */
    .pet-stage-label__age {
        padding: 2px 8px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-primary-soft);
        color: var(--pp-primary-dark);
        font-size: 11px;
        font-weight: 900;
    }
    
    @keyframes pet-breathe {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        50% { transform: scaleY(1.025) scaleX(0.99); }
    }
    
    @keyframes pet-slow-breathe {
        0%, 100% { transform: scaleY(1) translateY(0); }
        50% { transform: scaleY(0.985) translateY(3px); }
    }
    
    @keyframes pet-hop {
        0%, 100% { transform: translateY(0) scaleY(1); }
        35% { transform: translateY(-14px) scaleY(1.04); }
        55% { transform: translateY(0) scaleY(0.94); }
        70% { transform: translateY(0) scaleY(1); }
    }
    
    @keyframes pet-wobble {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-2.5deg); }
        70% { transform: rotate(2.5deg); }
    }
    
    @keyframes pet-wag {
        0%, 100% { transform: rotate(-7deg); }
        50% { transform: rotate(9deg); }
    }
    
    @keyframes pet-blink {
        0%, 92%, 100% { transform: scaleY(0); }
        94%, 97% { transform: scaleY(1); }
    }
    
    @keyframes pet-float {
        0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(10px, -22px) scale(1.1); }
    }
    
    @keyframes pet-sparkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    
    /* Yumurta mərhələsi — hələ "yatır", yalnız yüngül tərpənir. */
    .pet--egg {
        animation: pet-egg-rock 3s ease-in-out infinite;
    }
    
    @keyframes pet-egg-rock {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
    }
    
    /* ---------- Bədənin rəngləri ----------
       Rəsm bir dənədir, rəng isə növdən gəlir: PetAvatar SVG-nin üstündə
       --pet-fur / --pet-belly / --pet-inner-ear dəyişənlərini qoyur, ona görə
       eyni yol dörd növə (tülkü, pişik, əjdaha, dovşan) xidmət edir. */
    .pet__fur { fill: var(--pet-fur, #F3A05A); }
    .pet__belly { fill: var(--pet-belly, #FFF3E2); }
    .pet__inner-ear { fill: var(--pet-inner-ear, #FFD3A8); }
    
    /* Kontur bütün mərhələlərdə eyni qalınlıqdadır — kiçik ölçüdə forma
       yumşalmasın deyə. */
    .pet__outline {
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    .pet__eye,
    .pet__nose { fill: #2B2140; }
    
    .pet__mouth {
        fill: none;
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yumulmuş və gülən gözlər xətdir, dolgu deyil. */
    .pet__lash {
        fill: none;
        stroke: #2B2140;
        stroke-width: 4;
        stroke-linecap: round;
    }
    
    /* Tam ekran otaqlarda pet öz qutusunu doldurur. Standart `.pet` eni
       `min(210px, 62vw)`-dir — səhnə üçün doğrudur, amma otaqda qutunun ölçüsünü
       səhnə özü seçir (güzgünün qarşısı, vanna, yataq) və pet həmin qutuya
       oturmalıdır, yoxsa sola sürüşür və ya qutudan daşır. */
    .bathroom__pet .pet,
    .bedroom__pet .pet,
    .closet__pet .pet {
        width: 100%;
        max-width: none;
    }
    
    /* Növə xas detallar: tülkünün qulaq ucları, pişik və dovşanın bığları.
       Bunlar tükün rəngindən asılı deyil — həmişə tünd, çünki siluetin oxunması
       onlardan asılıdır. */
    .pet__ear-tip { fill: #2B2140; }
    
    .pet__whisker {
        fill: none;
        stroke: #2B2140;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yalnız konturla çəkilən formalar (əjdahanın silsiləsi, dovşanın qulaq
       cizgiləri) və dovşanın ön dişləri. */
    .pet__line { fill: none; }
    
    .pet__tooth {
        stroke: #2B2140;
        stroke-width: 1.4;
        stroke-linejoin: round;
    }
    

    .closet {
        position: absolute;
        inset: 0;
        z-index: 60;
        overflow: hidden;
        background: linear-gradient(180deg, #F9F2E6 0%, #EFE2CB 100%);
        animation: pp-closet-in 220ms ease-out;
    
        /* Rəf lentinin hündürlüyü bir yerdə saxlanılır: pet də, otağın döşəməsi də
           ona görə yerləşir. */
        --closet-tray: calc(150px + var(--pp-safe-bottom));
    }
    
    @keyframes pp-closet-in {
        from { opacity: 0; transform: scale(1.03); }
        to { opacity: 1; transform: scale(1); }
    }
    
    .closet__room {
        position: absolute;
        /* Digər otaqlarla eyni: sabit 390x620 qutu ekranın altına yapışır və
           ENƏ görə miqyaslanır (petCare.js → fitRooms). Əvvəl faizlə idi —
           uzun ekranda güzgü dartılır, pet altda kiçik qalırdı. */
        left: 50%;
        bottom: 0;
        width: 390px;
        height: 620px;
        transform: translateX(-50%) scale(var(--room-scale, 1));
        transform-origin: bottom center;
        /* Otağın öz yığın konteksti. Onsuz içəridəki z-index-lər (divar 0,
           güzgü 3, pərdə 7) pet və rəf lenti ilə eyni müstəvidə yarışır —
           nəticədə pet güzgünün ARXASINDA qalırdı. */
        isolation: isolate;
        z-index: 0;
    }
    
    .closet__decor {
        position: absolute;
        inset: 0;
        pointer-events: none;
        isolation: isolate;
        z-index: 0;
    }
    
    .closet__pet {
        position: absolute;
        left: 50%;
        /* Ayaqlar güzgünün altlığına düşür; SVG-nin altındakı boş sahə rəf
           lentinin arxasına girir, ona görə mənfi boşluq qəsdəndir. */
        /* Otağın öz koordinatında: ayaqlar güzgünün altlığına düşür, aşağıdakı
           boş sahə isə rəf lentinin arxasına girir. */
        bottom: 132px;
        transform: translateX(-50%);
        width: 300px;
        z-index: 2;
    }
    
    .closet__bar {
        position: absolute;
        top: calc(12px + var(--pp-safe-top));
        left: var(--pp-gutter);
        right: var(--pp-gutter);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        z-index: 4;
    }
    
    .overlay-close {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--pp-card) 0%, var(--pp-card-soft) 100%);
        border: 3px solid var(--pp-border);
        box-shadow: 0 4px 0 var(--pp-edge-neutral), var(--pp-shadow-md);
        font-size: 20px;
        font-weight: 900;
        color: var(--pp-ink);
        transition: transform 130ms ease, box-shadow 130ms ease;
    }
    
    .overlay-close:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
    }
    
    .closet__clear {
        padding: 11px 16px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-card);
        box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
        font-size: 13px;
        font-weight: 900;
        color: var(--pp-primary-dark);
    }
    
    .closet__clear:active { transform: translateY(2px); }
    
    .closet__error {
        position: absolute;
        top: calc(78px + var(--pp-safe-top));
        left: var(--pp-gutter);
        right: var(--pp-gutter);
        padding: 10px 14px;
        border-radius: var(--pp-radius-sm);
        background: var(--pp-alert-soft);
        color: var(--pp-alert);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
        z-index: 4;
    }
    
    .closet__tray {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--closet-tray);
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 30px var(--pp-gutter) calc(14px + var(--pp-safe-bottom));
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior: contain;
        scroll-snap-type: x proximity;
        background:
            linear-gradient(180deg, #E7D6B8 0%, #C4A87F 100%) no-repeat var(--pp-gutter) 18px / calc(100% - 2 * var(--pp-gutter)) 6px,
            linear-gradient(180deg, rgba(251, 247, 239, 0) 0%, rgba(251, 247, 239, 0.94) 34px, #FBF7EF 100%);
        z-index: 3;
    }
    
    .closet__item {
        position: relative;
        flex: 0 0 auto;
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 3px;
        width: 84px;
        margin-top: 14px;
        padding: 11px 6px;
        border-radius: var(--pp-radius-sm);
        background: var(--pp-spark-soft);
        border: 2px solid transparent;
        box-shadow: var(--pp-shadow-sm);
        text-align: center;
        scroll-snap-align: center;
        transition: transform 130ms ease, border-color 160ms ease;
    }
    
    .closet__item::before {
        content: '';
        position: absolute;
        top: -13px;
        left: 50%;
        width: 15px;
        height: 15px;
        transform: translateX(-50%);
        border: 3px solid #B9986C;
        border-bottom-color: transparent;
        border-radius: 50%;
    }
    
    .closet__item:active:not(:disabled) { transform: scale(0.94); }
    
    .closet__item--on {
        border-color: var(--pp-primary);
        background: var(--pp-primary-soft);
    }
    
    .closet__item--locked {
        background: var(--pp-card-soft);
        border: 1px dashed var(--pp-border);
    }
    
    .closet__icon { font-size: 28px; line-height: 1; }
    
    .closet__name {
        font-size: 11.5px;
        font-weight: 800;
    }
    
    .closet__meta {
        font-size: 10px;
        font-weight: 700;
        color: var(--pp-ink-soft);
    }
    
    .closet__item:not(.closet__item--locked) .closet__meta { color: var(--pp-spark-deep); }
    
    .closet__item--on .closet__meta { color: var(--pp-primary); }
    
    .closet__decor *,
    .closet__decor *::before,
    
    .closet__decor *::after {
        position: absolute;
        box-sizing: border-box;
    }
    
    .closet__wall {
        /* Divar otaq qutusundan yuxarı uzanır: uzun ekranda tavan yerində
           naxışsız zolaq qalmasın. Artığını .closet-in overflow-u kəsir. */
        inset: -700px 0 34% 0;
        z-index: 0;
        background:
            repeating-linear-gradient(
                90deg,
                #F9F2E6 0 5.4%,
                #EFE2CB 5.4% 10.8%
            );
    }
    
    .closet__wall::after {
        inset: 11.4% 0 0;
        content: "";
        background: linear-gradient(180deg, transparent, rgba(96,74,46,0.10));
        opacity: 0.34;
    }
    
    .closet__floor {
        inset: 65.4% 0 0;
        z-index: 0;
        background: linear-gradient(180deg, #E7CDA6, #D3B083);
    }
    
    .closet__floor::after {
        inset: 0;
        content: "";
        background: linear-gradient(
            90deg,
            transparent 0 24.7%,
            #D3B083 24.7% 25%,
            transparent 25% 49.7%,
            #D3B083 49.7% 50%,
            transparent 50% 74.7%,
            #D3B083 74.7% 75%,
            transparent 75%
        );
        opacity: 0.42;
    }
    
    .closet__floor::before {
        inset: 0;
        content: "";
        background: linear-gradient(
            180deg,
            transparent 0 35%,
            #D3B083 35% 35.5%,
            transparent 35.5% 69%,
            #D3B083 69% 69.5%,
            transparent 69.5%
        );
        opacity: 0.34;
    }
    
    .closet__planks {
        top: 66.7%;
        right: 0;
        left: 0;
        height: 10.8%;
        z-index: 1;
        opacity: 0.68;
        background:
            linear-gradient(
                90deg,
                transparent 0 20%,
                #D3B083 20% 20.8%,
                transparent 20.8% 48%,
                #D3B083 48% 48.8%,
                transparent 48.8% 75%,
                #D3B083 75% 75.8%,
                transparent 75.8%
            ),
            repeating-linear-gradient(
                0deg,
                transparent 0 31%,
                #D3B083 31% 33%
            );
    }
    
    .closet__planks::after {
        inset: 33% 0 0;
        content: "";
        background: linear-gradient(
            90deg,
            #D3B083 0 0.7%,
            transparent 0.7% 33%,
            #D3B083 33% 33.7%,
            transparent 33.7% 63%,
            #D3B083 63% 63.7%,
            transparent 63.7% 91%,
            #D3B083 91% 91.7%,
            transparent 91.7%
        );
        opacity: 0.74;
    }
    
    .closet__baseboard {
        top: 64.8%;
        right: 0;
        left: 0;
        height: 2.25%;
        z-index: 2;
        border-top: 2px solid #E4DCCE;
        border-bottom: 2px solid #D3B083;
        background: linear-gradient(180deg, #FBF7EF, #EFE2CB);
        box-shadow: 0 5px 10px rgba(96,74,46,0.13);
    }
    
    .closet__floor-depth {
        top: 67%;
        right: 0;
        left: 0;
