<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Ev — pet-in otağı, oyun avtomatı və sprint çipi ilə.
       Aşağıdakı qaydalar tətbiqin app.css/pet.css-indən OLDUĞU KİMİ köçürülüb
       (əl ilə yazılmayıb). Tətbiqin həmin bölmələri dəyişəndə bu artboard da
       yenidən qurulmalıdır — kanvas kodu güzgüləyir. */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* theme.css-in element sıfırlamaları: onsuz düymələr brauzerin öz çərçivəsi
       ilə çıxır (məsələn oyun avtomatının arxasında ağ qutu). */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    img,
    svg { max-width: 100%; display: block; }

    :root {
        /* Brend */
        --pp-primary: #6F5AD8;
        --pp-primary-dark: #54419E;
        --pp-primary-soft: #E9E4F7;
    
        /* ---- Üç rəng ailəsi ----
         * Hər ailənin bir işi var, ona görə oxumağı hələ yaxşı bacarmayan uşaq da
         * ekranda nə baş verdiyini rəngdən anlayır:
         *
         *   bənövşəyi — ağıl      : brend, öyrənmə, gem, əsas düymələr
         *   yaşıl     — canlılıq  : pet, dünya, doğru cavab, sağlam statlar
         *   narıncı   — enerji    : ulduz, seriya, mini oyunlar, kəşf
         *
         * Səhv rəngi qəsdən moruğa çalır. Narıncı "qazandın" deməkdir, ona görə
         * səhv ondan aydın seçilməlidir: köhnə mərcan (#FF7A6B) narıncıya cəmi
         * ~14° yaxın idi, moruq isə ~45° aralıdır.
         */
    
        /* Yaşıl — canlılıq */
        --pp-life: #35A57A;
        --pp-life-deep: #156F4F;   /* ağ mətn daşıya bilən yeganə yaşıl — 6.1:1 */
        --pp-life-soft: #DCEEE4;
        --pp-on-life: #06301D;     /* parlaq yaşıl dolgunun üstündəki mətn */
    
        /* Narıncı — enerji */
        --pp-spark: #E89A3C;
        --pp-spark-deep: #93540E;  /* açıq fonda narıncı mətn — 5.0:1 */
        --pp-spark-soft: #FAEBD6;
        --pp-on-spark: #3A1D00;    /* narıncının üstündə ağ mətn 2.3:1 verir — istifadə olunmur */
    
        /* Moruq — yalnız səhv */
        --pp-alert: #B7304C;
        --pp-alert-soft: #F7E1E5;
        --pp-on-alert: #FFFFFF;
    
        /* Səthlər */
        --pp-bg: #F0EBE0;
        --pp-card: #FBF7EF;
        --pp-card-soft: #F6F1E6;
        --pp-overlay: rgba(38, 30, 18, 0.58);
    
        /* Mətn */
        --pp-ink: #241E38;
        --pp-ink-soft: #5C5470;
        --pp-ink-muted: #8A82A0;
        --pp-on-primary: #FFFFFF;
    
        /* Sərhəd */
        --pp-border: #E4DCCE;
        --pp-track: #E8E2D6;
    
        /* Kölgə — rəngli, "oyuncaq" hissi verir */
        --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
        --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
        --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
    
        /* ---- Səth resepti ----
         * Mobil oyun düymələri düz dolğu deyil: yuxarısı işıqlı ("lift"), altında
         * isə bir neçə piksellik tünd kənar ("edge") var — həmin kənar düymənin
         * qalınlığıdır və basılanda azalır, ona görə element fiziki hiss olunur.
         * Yeni rəng ailəsi əlavə olunmur; hər dəyər mövcud ailənin çalarıdır.
         */
        --pp-primary-lift: #8A78E4;
        --pp-primary-edge: #4E3BA8;
        --pp-life-lift: #4FBB91;
        --pp-life-edge: #156F4F;
        --pp-spark-lift: #F2B166;
        --pp-spark-edge: #93540E;
        --pp-alert-lift: #C94764;
        --pp-alert-edge: #8A2038;
    
        /* Neytral səthlərin (kart, kapsul, dok) kənarı — rəngsiz, sadəcə dərinlik. */
        --pp-edge-neutral: rgba(96, 74, 46, 0.20);
    
        /* Üst kənardakı işıq zolağı — plastik parıltı hissi. */
        --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);
    
        /* Forma */
        --pp-radius-sm: 14px;
        --pp-radius: 22px;
        --pp-radius-lg: 30px;
        --pp-radius-pill: 999px;
    
        /* Ölçü */
        --pp-tap: 56px;
        --pp-gutter: 18px;
    
        /* Cihaz safe-area */
        --pp-safe-top: env(safe-area-inset-top, 0px);
        --pp-safe-bottom: env(safe-area-inset-bottom, 0px);
    
        color-scheme: light;
    }
    }

    .pp-root {
      --pp-safe-top: 0px;
      --pp-safe-bottom: 0px;
    }

    /* ==================== PET AVATAR ====================
     * Pet tamamilə inline SVG-dir — xarici asset yoxdur, ölçüdən asılı olmayaraq
     * kəskin görünür və mərhələ/əhval dəyişəndə anında yenilənir.
     * ==================================================== */
    
    .pet {
        width: min(210px, 62vw);
        height: auto;
        transform-origin: 50% 92%;
        animation: pet-breathe 3.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 14px rgba(60, 40, 20, 0.22));
    }
    
    .pet--excited { animation: pet-hop 900ms cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
    .pet--sad,
    .pet--sleepy { animation: pet-slow-breathe 5s ease-in-out infinite; }
    .pet--hungry { animation: pet-wobble 2.4s ease-in-out infinite; }
    
    /* Quyruq həmişə yüngülcə tərpənir — pet "canlı" görünsün. */
    .pet__tail {
        transform-origin: 68% 72%;
        animation: pet-wag 1.9s ease-in-out infinite;
    }
    
    .pet--excited .pet__tail { animation-duration: 700ms; }
    .pet--sad .pet__tail,
    .pet--sleepy .pet__tail { animation-duration: 4s; }
    
    /* Göz qırpma — nadir və qısa, diqqəti yayındırmır. */
    .pet__eyelid {
        transform-origin: center;
        animation: pet-blink 5.5s ease-in-out infinite;
    }
    
    .pet--sleepy .pet__eyelid { animation: none; }
    
    .pet__zzz {
        animation: pet-float 2.6s ease-in-out infinite;
    }
    
    .pet__sparkle {
        transform-origin: center;
        animation: pet-sparkle 1.8s ease-in-out infinite;
    }
    
    .pet-stage-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 14px;
        border-radius: var(--pp-radius-pill);
        background: rgba(255, 255, 255, 0.85);
        color: #3B2A66;
        font-size: 12px;
        font-weight: 800;
    }
    
    /* Yaş nişanın içində ayrıca kapsuldur: mərhələ adı ilə rəqəm bir-birinə
       qarışmasın deyə. */
    .pet-stage-label__age {
        padding: 2px 8px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-primary-soft);
        color: var(--pp-primary-dark);
        font-size: 11px;
        font-weight: 900;
    }
    
    @keyframes pet-breathe {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        50% { transform: scaleY(1.025) scaleX(0.99); }
    }
    
    @keyframes pet-slow-breathe {
        0%, 100% { transform: scaleY(1) translateY(0); }
        50% { transform: scaleY(0.985) translateY(3px); }
    }
    
    @keyframes pet-hop {
        0%, 100% { transform: translateY(0) scaleY(1); }
        35% { transform: translateY(-14px) scaleY(1.04); }
        55% { transform: translateY(0) scaleY(0.94); }
        70% { transform: translateY(0) scaleY(1); }
    }
    
    @keyframes pet-wobble {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-2.5deg); }
        70% { transform: rotate(2.5deg); }
    }
    
    @keyframes pet-wag {
        0%, 100% { transform: rotate(-7deg); }
        50% { transform: rotate(9deg); }
    }
    
    @keyframes pet-blink {
        0%, 92%, 100% { transform: scaleY(0); }
        94%, 97% { transform: scaleY(1); }
    }
    
    @keyframes pet-float {
        0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(10px, -22px) scale(1.1); }
    }
    
    @keyframes pet-sparkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    
    /* Yumurta mərhələsi — hələ "yatır", yalnız yüngül tərpənir. */
    .pet--egg {
        animation: pet-egg-rock 3s ease-in-out infinite;
    }
    
    @keyframes pet-egg-rock {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
    }
    
    /* ---------- Bədənin rəngləri ----------
       Rəsm bir dənədir, rəng isə növdən gəlir: PetAvatar SVG-nin üstündə
       --pet-fur / --pet-belly / --pet-inner-ear dəyişənlərini qoyur, ona görə
       eyni yol dörd növə (tülkü, pişik, əjdaha, dovşan) xidmət edir. */
    .pet__fur { fill: var(--pet-fur, #F3A05A); }
    .pet__belly { fill: var(--pet-belly, #FFF3E2); }
    .pet__inner-ear { fill: var(--pet-inner-ear, #FFD3A8); }
    
    /* Kontur bütün mərhələlərdə eyni qalınlıqdadır — kiçik ölçüdə forma
       yumşalmasın deyə. */
    .pet__outline {
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    .pet__eye,
    .pet__nose { fill: #2B2140; }
    
    .pet__mouth {
        fill: none;
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yumulmuş və gülən gözlər xətdir, dolgu deyil. */
    .pet__lash {
        fill: none;
        stroke: #2B2140;
        stroke-width: 4;
        stroke-linecap: round;
    }
    
    /* Tam ekran otaqlarda pet öz qutusunu doldurur. Standart `.pet` eni
       `min(210px, 62vw)`-dir — səhnə üçün doğrudur, amma otaqda qutunun ölçüsünü
       səhnə özü seçir (güzgünün qarşısı, vanna, yataq) və pet həmin qutuya
       oturmalıdır, yoxsa sola sürüşür və ya qutudan daşır. */
    .bathroom__pet .pet,
    .bedroom__pet .pet,
    .closet__pet .pet {
        width: 100%;
        max-width: none;
    }
    
    /* Növə xas detallar: tülkünün qulaq ucları, pişik və dovşanın bığları.
       Bunlar tükün rəngindən asılı deyil — həmişə tünd, çünki siluetin oxunması
       onlardan asılıdır. */
    .pet__ear-tip { fill: #2B2140; }
    
    .pet__whisker {
        fill: none;
        stroke: #2B2140;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yalnız konturla çəkilən formalar (əjdahanın silsiləsi, dovşanın qulaq
       cizgiləri) və dovşanın ön dişləri. */
    .pet__line { fill: none; }
    
    .pet__tooth {
        stroke: #2B2140;
        stroke-width: 1.4;
        stroke-linejoin: round;
    }
    

    .app-shell {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        background: var(--pp-bg);
        position: relative;
    }
    
    .app-main {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: var(--pp-gutter);
        /* Alt naviqasiya indi daha hündürdür (qalxan aktiv ikon üçün üst boşluq) —
           məzmun onun altında gizlənməsin deyə boşluq da böyüyür. */
        padding-bottom: calc(var(--pp-gutter) + 104px + var(--pp-safe-bottom));
    }
    
    .app-main--plain {
        padding-bottom: calc(var(--pp-gutter) + var(--pp-safe-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
    }
    
    .app-shell--immersive .topbar-shell {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 30;
        pointer-events: none;
    }
    
    .app-shell--immersive .topbar {
        background: none;
        box-shadow: none;
    }
    
    .app-shell--immersive .topbar-shell > *,
    .app-shell--immersive .topbar > * {
        pointer-events: auto;
    }
    
    .topbar__menu {
        margin: 12px var(--pp-gutter) 0;
    }
    
    .app-main--immersive {
        padding-top: 0;
    }
    
    .app-main--immersive .scene--hero {
        flex: 1 1 auto;
    }
    
    .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(10px + var(--pp-safe-top)) var(--pp-gutter) 12px;
        background: var(--pp-card);
        box-shadow: 0 2px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
        position: sticky;
        top: 0;
        z-index: 20;
    }
    
    .topbar__avatar {
        width: 42px;
        height: 42px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-primary-soft);
        display: grid;
        place-items: center;
        font-size: 22px;
        flex-shrink: 0;
    }
    
    .topbar__name {
        font-weight: 800;
        font-size: 17px;
        margin-right: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .topbar__actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .currency {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-card);
        box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
        font-weight: 900;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
    }
    
    .currency__icon {
        display: inline-flex;
        align-items: center;
        line-height: 1;
        flex-shrink: 0;
    }
    
    .currency--star { color: var(--pp-spark-deep); }
    
    .currency--gem { color: var(--pp-primary-dark); }
    
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--pp-tap);
        padding: 0 22px;
        border-radius: var(--pp-radius-pill);
        font-weight: 800;
        font-size: 16px;
        transition: transform 120ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }
    
    .btn:active:not(:disabled) {
        transform: translateY(3px);
    }
    
    .btn:disabled {
        opacity: 0.5;
        cursor: default;
    }
    
    .btn--block {
        display: flex;
        width: 100%;
    }
    
    .btn--primary {
        background: linear-gradient(180deg, var(--pp-primary-lift) 0%, var(--pp-primary) 100%);
        color: var(--pp-on-primary);
        box-shadow: 0 5px 0 var(--pp-primary-edge), var(--pp-shadow-md), var(--pp-gloss);
    }
    
    .btn--primary:active:not(:disabled) {
        box-shadow: 0 2px 0 var(--pp-primary-edge), var(--pp-shadow-sm), var(--pp-gloss);
    }
    
    .btn--ghost {
        background: var(--pp-card);
        color: var(--pp-primary);
        border: 2px solid var(--pp-border);
        box-shadow: 0 5px 0 var(--pp-edge-neutral);
    }
    
    .btn--ghost:active:not(:disabled) {
        box-shadow: 0 2px 0 var(--pp-edge-neutral);
    }
    
    .btn--success {
        background: linear-gradient(180deg, var(--pp-life-lift) 0%, var(--pp-life) 100%);
        color: var(--pp-on-life);
        box-shadow: 0 5px 0 var(--pp-life-edge), var(--pp-shadow-md), var(--pp-gloss);
    }
    
    .btn--success:active:not(:disabled) {
        box-shadow: 0 2px 0 var(--pp-life-edge), var(--pp-shadow-sm), var(--pp-gloss);
    }
    
    .btn--reward {
        background: linear-gradient(180deg, var(--pp-spark-lift) 0%, var(--pp-spark) 100%);
        color: var(--pp-on-spark);
        box-shadow: 0 5px 0 var(--pp-spark-edge), var(--pp-shadow-md), var(--pp-gloss);
    }
    
    .btn--reward:active:not(:disabled) {
        box-shadow: 0 2px 0 var(--pp-spark-edge), var(--pp-shadow-sm), var(--pp-gloss);
    }
    
    .btn--quiet {
        min-height: 44px;
        padding: 0 14px;
        font-size: 14px;
        color: var(--pp-ink-soft);
    }
    
    .scene {
        position: relative;
        border-radius: var(--pp-radius-lg);
        padding: 18px 16px 22px;
        overflow: hidden;
        box-shadow: var(--pp-shadow-md);
    }
    
    .scene--sunny  { --pp-sky: linear-gradient(180deg, #BEDFEE 0%, #D3E9F1 38%, #E8F1E8 58%, #E8F1E8 100%); }
    
    .scene--clear  { --pp-sky: linear-gradient(180deg, #C6E4F0 0%, #DBEDF4 38%, #EDF4EC 58%, #EDF4EC 100%); }
    
    .scene--cloudy { --pp-sky: linear-gradient(180deg, #B4C6D4 0%, #CCD9E1 38%, #E3E9E8 58%, #E3E9E8 100%); }
    
    .scene--rain   { --pp-sky: linear-gradient(180deg, #96A5B6 0%, #B6C2CE 38%, #D6DCDF 58%, #D6DCDF 100%); }
    
    .scene--storm  { --pp-sky: linear-gradient(180deg, #78838F 0%, #9AA4AE 38%, #BEC4C8 58%, #BEC4C8 100%); }
    
    .scene--sunny,
    .scene--clear,
    
    .scene--cloudy,
    .scene--rain,
    
    .scene--storm { background: var(--pp-sky); }
    
    .scene__sky {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    
    .scene__sun {
        position: absolute;
        top: 22px;
        right: 26px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle, #EFCE7C 0%, #EFCE7C 50%, rgba(245, 227, 180, 0.55) 51%, rgba(245, 227, 180, 0.55) 100%);
        animation: pp-sun-pulse 4s ease-in-out infinite;
    }
    
    .scene__cloud {
        position: absolute;
        top: 20px;
        width: 68px;
        height: 22px;
        border-radius: var(--pp-radius-pill);
        background: rgba(251, 248, 242, 0.9);
        animation: pp-drift 22s linear infinite;
    }
    
    .scene__cloud--b {
        top: 48px;
        width: 48px;
        height: 16px;
        opacity: 0.7;
        animation-duration: 30s;
        animation-delay: -8s;
    }
    
    .scene__hills {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 58%;
        display: block;
    }
    
    .scene__ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 54px;
        background: linear-gradient(180deg, #77BE97 0%, #35A57A 100%);
    }
    
    .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        z-index: 3;
    }
    
    .hud__level {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 16px 0 6px;
        border-radius: var(--pp-radius-pill);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 4px 0 var(--pp-edge-neutral), 0 10px 22px rgba(96, 74, 46, 0.18);
    }
    
    .hud__ring {
        position: relative;
        width: 42px;
        height: 42px;
        flex-shrink: 0;
    }
    
    .hud__ring-value {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 900;
        color: var(--pp-on-primary);
    }
    
    .hud__name {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
    }
    
    .hud__name-text {
        font-size: 16px;
        font-weight: 900;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .hud__name-sub {
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        color: var(--pp-ink-soft);
        font-variant-numeric: tabular-nums;
    }
    
    .hud__wallet {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;

    .scene__goal {

        z-index: 3;
        margin: 0 14px 14px;
        padding: 12px 16px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 5px 0 var(--pp-edge-neutral), 0 12px 26px rgba(96, 74, 46, 0.18);
    }
    
    .scene__pet {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 190px;
    }
    
    .bubble {
        position: relative;
        max-width: 92%;
        margin: 0 auto 10px;
        padding: 12px 16px;
        border-radius: var(--pp-radius);
        background: var(--pp-card);
        box-shadow: var(--pp-shadow-sm);
        font-weight: 700;
        font-size: 14px;
        text-align: center;
        animation: pp-pop 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: var(--pp-card);
        border-bottom: 0;
    }
    
    .actions {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 14px;

    .actions--five {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
    }
    
    .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 78px;

        box-shadow: 0 4px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
        text-decoration: none;
        color: var(--pp-ink);
        font-weight: 800;
        font-size: 12px;
        transition: transform 130ms ease, box-shadow 130ms ease;
    }
    
    .action:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);
    }

        height: 26px;
        color: var(--pp-life-deep);

    .action__icon svg {
        width: 100%;
        height: 100%;
    }
    
    .action--alert {
        background: var(--pp-alert-soft);
        box-shadow: 0 4px 0 var(--pp-alert-edge), var(--pp-shadow-sm);
    }
    
    .action--alert .action__icon,
    .action--alert > span:last-child {
        color: var(--pp-alert);
    }
    
    @keyframes pp-closet-in {
        from { opacity: 0; transform: scale(1.03); }

    .bubbles {
        position: relative;
        height: 260px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: var(--pp-radius);
        background: linear-gradient(180deg, var(--pp-primary-soft), var(--pp-card-soft));
    }
    
    .bubble-pop {
        position: absolute;
        left: var(--x, 50%);
        bottom: -70px;
        width: 56px;
        height: 56px;
        padding: 0;
        background: none;
        border: 0;
        /* Baloncuqlar CSS ilə üzür — kadr-kadr render yoxdur. Axın raunddan asılı
           deyil: hər baloncuq öz müddətini yaşayır və yuxarıda sönür. */
        animation: bubble-float var(--dur, 7000ms) linear var(--start, 0ms) forwards;
    }
    
    .bubble-pop__body {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #FFFFFF, var(--pp-gem, #8FD8F5));
        border: 2px solid var(--pp-primary);
        /* Baloncuğun fonu hər iki rejimdə sabit açıqdır, ona görə rəqəm də sabit
           tünd olmalıdır: --pp-ink gecə rejimində ağarır və rəqəm tamam itirdi. */
        color: #241A55;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        font-size: 21px;
        font-weight: 900;
    }
    
    .bubble-pop--gone,
    .bubble-pop--wrong { pointer-events: none; }
    
    .bubble-pop--gone .bubble-pop__body { animation: bubble-burst 300ms ease forwards; }
    
    .bubble-pop--wrong .bubble-pop__body {
        border-color: var(--pp-alert);
        animation: bubble-miss 320ms ease forwards;
    }
    
    .sprint {
        position: absolute;
        right: 14px;
        bottom: 96px;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 9px;
        max-width: min(238px, 70%);
        padding: 7px 8px 7px 12px;
        border-radius: var(--pp-radius-pill);
        background: linear-gradient(135deg, var(--pp-primary-dark) 0%, var(--pp-primary) 100%);
        color: var(--pp-on-primary);
        box-shadow: 0 4px 0 var(--pp-primary-edge), var(--pp-shadow-md);
        text-align: left;
        animation: pp-pop 320ms cubic-bezier(0.22, 1, 0.36, 1);
        transition: transform 130ms ease, box-shadow 130ms ease;
    }
    
    .sprint:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--pp-primary-edge), var(--pp-shadow-sm);
    }
    
    .sprint__icon { font-size: 19px; line-height: 1; flex-shrink: 0; }
    
    .sprint__body { min-width: 0; }
    
    .sprint__title { display: block; font-weight: 900; font-size: 13px; line-height: 1.15; }
    
    .sprint__text { display: block; font-size: 10.5px; font-weight: 700; opacity: 0.92; }
    
    .sprint__go {
        flex-shrink: 0;
        padding: 8px 13px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-card);
        color: var(--pp-primary-dark);
        font-weight: 900;
        font-size: 12.5px;
    }
    
    @keyframes pp-spin {
        to { transform: rotate(360deg); }
    }
    
    @keyframes pp-pop {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    @keyframes pp-bounce {
        0% { transform: scale(0.4); opacity: 0; }
        60% { transform: scale(1.18); opacity: 1; }
        100% { transform: scale(1); }
    }
    
    @keyframes pp-sun-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    
    @keyframes pp-drift {
        from { transform: translateX(-90px); }
        to { transform: translateX(560px); }
    }
  </style>
