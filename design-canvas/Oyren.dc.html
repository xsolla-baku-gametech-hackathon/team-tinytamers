<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Öyrən */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;

      /* İSTİQAMƏT B — yumşaldılmış. Ailə adları və mənaları eynidir; yalnız xroma
      və səth parlaqlığı azalıb. Bütün mətn cütləri WCAG 4.5:1-dən yuxarıdadır. */
      --pp-primary: #6F5AD8;
      --pp-primary-dark: #54419E;
      --pp-primary-soft: #E9E4F7;
      --pp-primary-lift: #8A78E4;
      --pp-primary-edge: #4E3BA8;

      --pp-life: #35A57A;
      --pp-life-deep: #156F4F;
      --pp-life-soft: #DCEEE4;
      --pp-life-lift: #4FBB91;
      --pp-life-edge: #156F4F;
      --pp-on-life: #06301D;

      --pp-spark: #E89A3C;
      --pp-spark-deep: #93540E;
      --pp-spark-soft: #FAEBD6;
      --pp-spark-lift: #F2B166;
      --pp-spark-edge: #93540E;
      --pp-on-spark: #3A1D00;

      --pp-alert: #B7304C;
      --pp-alert-soft: #F7E1E5;
      --pp-alert-edge: #8A2038;

      --pp-bg: #F0EBE0;
      --pp-card: #FBF7EF;
      --pp-card-soft: #F6F1E6;
      --pp-glass: rgba(251, 247, 239, 0.94);

      --pp-ink: #241E38;
      --pp-ink-soft: #5C5470;
      --pp-ink-muted: #8A82A0;

      --pp-border: #E4DCCE;
      --pp-track: #E8E2D6;

      --pp-edge-neutral: rgba(96, 74, 46, 0.20);
      --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
      --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
      --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
      --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);

      /* Səhnə — süd kimi səma, sakit çəmən */
      --sc-sky-1: #BEDFEE;
      --sc-sky-2: #D3E9F1;
      --sc-sky-3: #E8F1E8;
      --sc-sun: #EFCE7C;
      --sc-sun-halo: #F5E3B4;
      --sc-cloud: #FBF8F2;
      --sc-hill-1: #CFE3D2;
      --sc-hill-2: #A5D3B7;
      --sc-hill-3: #77BE97;
      --sc-hill-4: #35A57A;
    }
    a { color: var(--pp-primary-dark); }
    a:hover { color: var(--pp-primary); }
  </style>
</helmet>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px 0 8px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm);">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">

        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7.5 4h9l4 5-8.5 11L3.5 9z" fill="var(--pp-primary-lift)" stroke="var(--pp-primary-edge)" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M7.5 4l4.5 5 4.5-5M3.5 9h17" fill="none" stroke="var(--pp-primary-edge)" stroke-width="1.4" />
        </svg>
        <span style="font-size: 14px; font-weight: 900; color: var(--pp-primary-dark);">12</span>
      </div>
    </div>
  </div>

  <!-- ===== DESTIN GEDISATI ===== -->
  <div style="position: absolute; top: 116px; left: 16px; right: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px;">

  <div style="position: absolute; top: 174px; left: 16px; right: 16px; padding: 16px; border-radius: 22px; background: var(--pp-card); box-shadow: 0 4px 0 var(--pp-edge-neutral), var(--pp-shadow-md); display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; flex-direction: column; gap: 10px;">

      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 18px; background: var(--pp-card-soft); border: 2px solid var(--pp-border); box-shadow: 0 3px 0 var(--pp-edge-neutral);">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: var(--pp-primary-soft); color: var(--pp-primary-dark); font-size: 15px; font-weight: 900;">B</span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 800;">5 alma</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 18px; background: var(--pp-card-soft); border: 2px solid var(--pp-border); box-shadow: 0 3px 0 var(--pp-edge-neutral);">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: var(--pp-primary-soft); color: var(--pp-primary-dark); font-size: 15px; font-weight: 900;">C</span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 800;">8 alma</span>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 18px; background: var(--pp-card-soft); border: 2px solid var(--pp-border); box-shadow: 0 3px 0 var(--pp-edge-neutral);">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: var(--pp-primary-soft); color: var(--pp-primary-dark); font-size: 15px; font-weight: 900;">D</span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 800;">2 alma</span>
      </div>
    </div>

    <!-- ===== GERI ELAQE ===== -->
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 18px; background: var(--pp-life-soft);">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px; background: var(--pp-life-deep);">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

      </span>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 900; color: var(--pp-life-deep);">Doğrudur! Pet sevindi.</div>
        <div style="font-size: 13px; font-weight: 700; line-height: 1.4; color: var(--pp-life-deep);">4 üstəgəl 2 altı edir. Barmaqlarınla da yoxlaya bilərsən.</div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: var(--pp-spark-soft);">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">

        </svg>
        <span style="font-size: 12px; font-weight: 900; color: var(--pp-spark-deep);">+5</span>
      </span>
    </div>

    <!-- ===== ESAS DUYME ===== -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: linear-gradient(180deg, var(--pp-primary-lift) 0%, var(--pp-primary) 100%); box-shadow: 0 5px 0 var(--pp-primary-edge), var(--pp-shadow-md), var(--pp-gloss); color: #FFFFFF; font-size: 17px; font-weight: 900;">Növbəti sual</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; gap: 4px; padding: 22px 10px 14px; background: linear-gradient(180deg, transparent 0%, rgba(240, 235, 224, 0.55) 55%, rgba(240, 235, 224, 0.85) 100%); z-index: 20;">

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">

        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.2A4 4 0 0 1 12 8a4 4 0 0 1 7 2.8C19 15.6 12 20 12 20z" stroke="var(--pp-ink-muted)" stroke-width="2" stroke-linejoin="round" /></svg>

    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 2px 0 var(--pp-edge-neutral);">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M9 5L3.5 7v12L9 17l6 2 5.5-2V5L15 7z" stroke="var(--pp-ink-muted)" stroke-width="2" stroke-linejoin="round" /><path d="M9 5v12M15 7v12" stroke="var(--pp-ink-muted)" stroke-width="2" /></svg>
      </span>
      <span style="font-size: 11px; font-weight: 800; color: var(--pp-ink-soft);">Dünya</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 2px 0 var(--pp-edge-neutral);">
