<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Otaq · Yuxu (işıq sönüb) — pet yatır, otaq gecəyə keçir.
       Aşağıdakı qaydalar tətbiqin app.css/pet.css-indən OLDUĞU KİMİ köçürülüb
       (əl ilə yazılmayıb). Tətbiqin həmin bölmələri dəyişəndə bu artboard da
       yenidən qurulmalıdır — kanvas kodu güzgüləyir. */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* theme.css-in element sıfırlamaları: onsuz düymələr brauzerin öz çərçivəsi
       ilə çıxır (məsələn oyun avtomatının arxasında ağ qutu). */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    img,
    svg { max-width: 100%; display: block; }

    :root {
        /* Brend */
        --pp-primary: #6F5AD8;
        --pp-primary-dark: #54419E;
        --pp-primary-soft: #E9E4F7;
    
        /* ---- Üç rəng ailəsi ----
         * Hər ailənin bir işi var, ona görə oxumağı hələ yaxşı bacarmayan uşaq da
         * ekranda nə baş verdiyini rəngdən anlayır:
         *
         *   bənövşəyi — ağıl      : brend, öyrənmə, gem, əsas düymələr
         *   yaşıl     — canlılıq  : pet, dünya, doğru cavab, sağlam statlar
         *   narıncı   — enerji    : ulduz, seriya, mini oyunlar, kəşf
         *
         * Səhv rəngi qəsdən moruğa çalır. Narıncı "qazandın" deməkdir, ona görə
         * səhv ondan aydın seçilməlidir: köhnə mərcan (#FF7A6B) narıncıya cəmi
         * ~14° yaxın idi, moruq isə ~45° aralıdır.
         */
    
        /* Yaşıl — canlılıq */
        --pp-life: #35A57A;
        --pp-life-deep: #156F4F;   /* ağ mətn daşıya bilən yeganə yaşıl — 6.1:1 */
        --pp-life-soft: #DCEEE4;
        --pp-on-life: #06301D;     /* parlaq yaşıl dolgunun üstündəki mətn */
    
        /* Narıncı — enerji */
        --pp-spark: #E89A3C;
        --pp-spark-deep: #93540E;  /* açıq fonda narıncı mətn — 5.0:1 */
        --pp-spark-soft: #FAEBD6;
        --pp-on-spark: #3A1D00;    /* narıncının üstündə ağ mətn 2.3:1 verir — istifadə olunmur */
    
        /* Moruq — yalnız səhv */
        --pp-alert: #B7304C;
        --pp-alert-soft: #F7E1E5;
        --pp-on-alert: #FFFFFF;
    
        /* Səthlər */
        --pp-bg: #F0EBE0;
        --pp-card: #FBF7EF;
        --pp-card-soft: #F6F1E6;
        --pp-overlay: rgba(38, 30, 18, 0.58);
    
        /* Mətn */
        --pp-ink: #241E38;
        --pp-ink-soft: #5C5470;
        --pp-ink-muted: #8A82A0;
        --pp-on-primary: #FFFFFF;
    
        /* Sərhəd */
        --pp-border: #E4DCCE;
        --pp-track: #E8E2D6;
    
        /* Kölgə — rəngli, "oyuncaq" hissi verir */
        --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
        --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
        --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
    
        /* ---- Səth resepti ----
         * Mobil oyun düymələri düz dolğu deyil: yuxarısı işıqlı ("lift"), altında
         * isə bir neçə piksellik tünd kənar ("edge") var — həmin kənar düymənin
         * qalınlığıdır və basılanda azalır, ona görə element fiziki hiss olunur.
         * Yeni rəng ailəsi əlavə olunmur; hər dəyər mövcud ailənin çalarıdır.
         */
        --pp-primary-lift: #8A78E4;
        --pp-primary-edge: #4E3BA8;
        --pp-life-lift: #4FBB91;
        --pp-life-edge: #156F4F;
        --pp-spark-lift: #F2B166;
        --pp-spark-edge: #93540E;
        --pp-alert-lift: #C94764;
        --pp-alert-edge: #8A2038;
    
        /* Neytral səthlərin (kart, kapsul, dok) kənarı — rəngsiz, sadəcə dərinlik. */
        --pp-edge-neutral: rgba(96, 74, 46, 0.20);
    
        /* Üst kənardakı işıq zolağı — plastik parıltı hissi. */
        --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);
    
        /* Forma */
        --pp-radius-sm: 14px;
        --pp-radius: 22px;
        --pp-radius-lg: 30px;
        --pp-radius-pill: 999px;
    
        /* Ölçü */
        --pp-tap: 56px;
        --pp-gutter: 18px;
    
        /* Cihaz safe-area */
        --pp-safe-top: env(safe-area-inset-top, 0px);
        --pp-safe-bottom: env(safe-area-inset-bottom, 0px);
    
        color-scheme: light;
    }
    }

    .pp-root {
      --pp-safe-top: 0px;
      --pp-safe-bottom: 0px;
    }

    /* ==================== PET AVATAR ====================
     * Pet tamamilə inline SVG-dir — xarici asset yoxdur, ölçüdən asılı olmayaraq
     * kəskin görünür və mərhələ/əhval dəyişəndə anında yenilənir.
     * ==================================================== */
    
    .pet {
        width: min(210px, 62vw);
        height: auto;
        transform-origin: 50% 92%;
        animation: pet-breathe 3.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 14px rgba(60, 40, 20, 0.22));
    }
    
    .pet--excited { animation: pet-hop 900ms cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
    .pet--sad,
    .pet--sleepy { animation: pet-slow-breathe 5s ease-in-out infinite; }
    .pet--hungry { animation: pet-wobble 2.4s ease-in-out infinite; }
    
    /* Quyruq həmişə yüngülcə tərpənir — pet "canlı" görünsün. */
    .pet__tail {
        transform-origin: 68% 72%;
        animation: pet-wag 1.9s ease-in-out infinite;
    }
    
    .pet--excited .pet__tail { animation-duration: 700ms; }
    .pet--sad .pet__tail,
    .pet--sleepy .pet__tail { animation-duration: 4s; }
    
    /* Göz qırpma — nadir və qısa, diqqəti yayındırmır. */
    .pet__eyelid {
        transform-origin: center;
        animation: pet-blink 5.5s ease-in-out infinite;
    }
    
    .pet--sleepy .pet__eyelid { animation: none; }
    
    .pet__zzz {
        animation: pet-float 2.6s ease-in-out infinite;
    }
    
    .pet__sparkle {
        transform-origin: center;
        animation: pet-sparkle 1.8s ease-in-out infinite;
    }
    
    .pet-stage-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 14px;
        border-radius: var(--pp-radius-pill);
        background: rgba(255, 255, 255, 0.85);
        color: #3B2A66;
        font-size: 12px;
        font-weight: 800;
    }
    
    /* Yaş nişanın içində ayrıca kapsuldur: mərhələ adı ilə rəqəm bir-birinə
       qarışmasın deyə. */
    .pet-stage-label__age {
        padding: 2px 8px;
        border-radius: var(--pp-radius-pill);
        background: var(--pp-primary-soft);
        color: var(--pp-primary-dark);
        font-size: 11px;
        font-weight: 900;
    }
    
    @keyframes pet-breathe {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        50% { transform: scaleY(1.025) scaleX(0.99); }
    }
    
    @keyframes pet-slow-breathe {
        0%, 100% { transform: scaleY(1) translateY(0); }
        50% { transform: scaleY(0.985) translateY(3px); }
    }
    
    @keyframes pet-hop {
        0%, 100% { transform: translateY(0) scaleY(1); }
        35% { transform: translateY(-14px) scaleY(1.04); }
        55% { transform: translateY(0) scaleY(0.94); }
        70% { transform: translateY(0) scaleY(1); }
    }
    
    @keyframes pet-wobble {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-2.5deg); }
        70% { transform: rotate(2.5deg); }
    }
    
    @keyframes pet-wag {
        0%, 100% { transform: rotate(-7deg); }
        50% { transform: rotate(9deg); }
    }
    
    @keyframes pet-blink {
        0%, 92%, 100% { transform: scaleY(0); }
        94%, 97% { transform: scaleY(1); }
    }
    
    @keyframes pet-float {
        0% { opacity: 0; transform: translate(0, 0) scale(0.8); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(10px, -22px) scale(1.1); }
    }
    
    @keyframes pet-sparkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    
    /* Yumurta mərhələsi — hələ "yatır", yalnız yüngül tərpənir. */
    .pet--egg {
        animation: pet-egg-rock 3s ease-in-out infinite;
    }
    
    @keyframes pet-egg-rock {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
    }
    
    /* ---------- Bədənin rəngləri ----------
       Rəsm bir dənədir, rəng isə növdən gəlir: PetAvatar SVG-nin üstündə
       --pet-fur / --pet-belly / --pet-inner-ear dəyişənlərini qoyur, ona görə
       eyni yol dörd növə (tülkü, pişik, əjdaha, dovşan) xidmət edir. */
    .pet__fur { fill: var(--pet-fur, #F3A05A); }
    .pet__belly { fill: var(--pet-belly, #FFF3E2); }
    .pet__inner-ear { fill: var(--pet-inner-ear, #FFD3A8); }
    
    /* Kontur bütün mərhələlərdə eyni qalınlıqdadır — kiçik ölçüdə forma
       yumşalmasın deyə. */
    .pet__outline {
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    .pet__eye,
    .pet__nose { fill: #2B2140; }
    
    .pet__mouth {
        fill: none;
        stroke: #2B2140;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yumulmuş və gülən gözlər xətdir, dolgu deyil. */
    .pet__lash {
        fill: none;
        stroke: #2B2140;
        stroke-width: 4;
        stroke-linecap: round;
    }
    
    /* Tam ekran otaqlarda pet öz qutusunu doldurur. Standart `.pet` eni
       `min(210px, 62vw)`-dir — səhnə üçün doğrudur, amma otaqda qutunun ölçüsünü
       səhnə özü seçir (güzgünün qarşısı, vanna, yataq) və pet həmin qutuya
       oturmalıdır, yoxsa sola sürüşür və ya qutudan daşır. */
    .bathroom__pet .pet,
    .bedroom__pet .pet,
    .closet__pet .pet {
        width: 100%;
        max-width: none;
    }
    
    /* Növə xas detallar: tülkünün qulaq ucları, pişik və dovşanın bığları.
       Bunlar tükün rəngindən asılı deyil — həmişə tünd, çünki siluetin oxunması
       onlardan asılıdır. */
    .pet__ear-tip { fill: #2B2140; }
    
    .pet__whisker {
        fill: none;
        stroke: #2B2140;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    
    /* Yalnız konturla çəkilən formalar (əjdahanın silsiləsi, dovşanın qulaq
       cizgiləri) və dovşanın ön dişləri. */
    .pet__line { fill: none; }
    
    .pet__tooth {
        stroke: #2B2140;
        stroke-width: 1.4;
        stroke-linejoin: round;
    }
    

    .bedroom {
        --bd-wall-top: #F3E7DA;
        --bd-wall-bottom: #EADCC8;
        --bd-wall-pattern: #E9E4F7;
        --bd-floor-top: #E6CBA4;
        --bd-floor-bottom: #D9BA8E;
        --bd-floor-line: #E4DCCE;
        --bd-trim: #FBF7EF;
        --bd-trim-edge: #E4DCCE;
        --bd-window-top: #F3E7DA;
        --bd-window-bottom: #F2B166;
        --bd-window-frame: #FBF7EF;
        --bd-window-hill: #54419E;
        --bd-rug-top: #E9E4F7;
        --bd-rug-bottom: #8A78E4;
        --bd-frame-main: #6F5AD8;
        --bd-frame-lift: #8A78E4;
        --bd-cabinet-main: #6F5AD8;
        --bd-cabinet-lift: #8A78E4;
        --bd-lamp-shade: #F2B166;
        --bd-lamp-edge: #E89A3C;
        --bd-lamp-metal: #5C5470;
        --bd-shadow-soft: rgba(96,74,46,0.13);
        --bd-shadow-strong: rgba(96,74,46,0.18);
        --bd-sleep-color: #E9E4F7;
        --bd-moonlight: rgba(233,228,247,0.46);
        --bd-moonlight-clear: rgba(138,120,228,0);
        /* Yataq otağı da şkaf kimi AYRICA TAM EKRAN otaqdır: statlar, dok və alt
           naviqasiya yox olur, uşaq otağa girir və işığı söndürüb çıxır. */
        position: absolute;
        inset: 0;
        z-index: 60;
        overflow: hidden;
        background-color: var(--bd-wall-top);
        animation: pp-closet-in 220ms ease-out;
    }
    
    .bedroom--dark {
        --bd-wall-top: #3A3168;
        --bd-wall-bottom: #2B2360;
        --bd-wall-pattern: #54419E;
        --bd-floor-top: #3E3470;
        --bd-floor-bottom: #2C2552;
        --bd-floor-line: #3A3168;
        --bd-trim: #3A3168;
        --bd-trim-edge: #5C5470;
        --bd-window-top: #3A3168;
        --bd-window-bottom: #2B2360;
        --bd-window-frame: #5C5470;
        --bd-window-hill: #241E38;
        --bd-rug-top: #54419E;
        --bd-rug-bottom: #6F5AD8;
        --bd-frame-main: #54419E;
        --bd-frame-lift: #6F5AD8;
        --bd-cabinet-main: #54419E;
        --bd-cabinet-lift: #6F5AD8;
        --bd-lamp-shade: #3A3168;
        --bd-lamp-edge: #8A78E4;
        --bd-lamp-metal: #5C5470;
        --bd-shadow-soft: rgba(12,8,30,0.45);
        --bd-shadow-strong: rgba(12,8,30,0.45);
    }
    
    .bedroom,
    .bedroom *,
    
    .bedroom *::before,
    .bedroom *::after {
        transition:
            background-color 800ms ease,
            background-image 800ms ease,
            border-color 800ms ease,
            box-shadow 800ms ease,
            color 800ms ease,
            filter 800ms ease,
            opacity 800ms ease;
    }
    
    .bedroom__wall {
        position: absolute;
        z-index: 0;
        inset: -700px 0 auto;
        /* Divar yuxarı uzanır: uzun ekranda tavan boşluğu naxışsız qalmasın. */
        height: 1084px;
        background: linear-gradient(180deg, var(--bd-wall-top), var(--bd-wall-bottom));
    }
    
    .bedroom__wall-pattern {
        position: absolute;
        inset: 0 0 0;
        background-image:
            radial-gradient(circle at 8px 8px, var(--bd-wall-pattern) 0 2px, transparent 2.5px),
            radial-gradient(circle at 29px 29px, var(--bd-wall-pattern) 0 1.5px, transparent 2px);
        background-size: 38px 38px;
        opacity: 0.62;
    }
    
    .bedroom__window {
        position: absolute;
        z-index: 2;
        top: 103px;
        left: 269px;
        width: 97px;
        height: 126px;
        padding: 7px;
        overflow: hidden;
        border: 3px solid var(--bd-trim-edge);
        border-radius: 17px 17px 10px 10px;
        background: var(--bd-window-frame);
        box-shadow: 0 7px 0 var(--bd-shadow-soft);
    }
    
    .bedroom__window::before,
    .bedroom__window::after {
        content: "";
        position: absolute;
        z-index: 6;
        background: var(--bd-window-frame);
    }
    
    .bedroom__window::before {
        top: 7px;
        bottom: 7px;
        left: 45px;
        width: 6px;
    }
    
    .bedroom__window::after {
        top: 58px;
        right: 7px;
        left: 7px;
        height: 6px;
    }
    
    .bedroom__window-view {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 9px 9px 4px 4px;
        background: linear-gradient(180deg, var(--bd-window-top), var(--bd-window-bottom));
    }
    
    .bedroom__sun,
    .bedroom__moon {
        position: absolute;
        border-radius: 50%;
    }
    
    .bedroom__sun {
        right: 9px;
        bottom: 17px;
        width: 38px;
        height: 38px;
        background: #F2B166;
        box-shadow: 0 0 0 8px rgba(242,177,102,0.34);
        opacity: 1;
    }
    
    .bedroom__moon {
        top: 12px;
        left: 48px;
        width: 28px;
        height: 28px;
        border: 3px solid #E9E4F7;
        background: #F6F1E6;
        box-shadow: 0 0 0 6px rgba(233,228,247,0.18);
        opacity: 0;
    }
    
    .bedroom__moon::before,
    .bedroom__moon::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #E4DCCE;
    }
    
    .bedroom__moon::before {
        top: 5px;
        left: 5px;
        width: 6px;
        height: 6px;
    }
    
    .bedroom__moon::after {
        right: 4px;
        bottom: 5px;
        width: 4px;
        height: 4px;
    }
    
    .bedroom__window-star {
        position: absolute;
        width: 8px;
        height: 8px;
        clip-path: polygon(50% 0, 62% 37%, 100% 50%, 62% 63%, 50% 100%, 38% 63%, 0 50%, 38% 37%);
        background: #F2B166;
        opacity: 0;
    }
    
    .bedroom__window-star:nth-of-type(3) {
        top: 16px;
        left: 12px;
    }
    
    .bedroom__window-star:nth-of-type(4) {
        top: 39px;
        left: 33px;
        width: 6px;
        height: 6px;
    }
    
    .bedroom__window-star:nth-of-type(5) {
        top: 11px;
        left: 37px;
        width: 5px;
        height: 5px;
    }
    
    .bedroom__window-star:nth-of-type(6) {
        top: 45px;
        right: 10px;
        width: 5px;
        height: 5px;
    }
    
    .bedroom__window-hill {
        position: absolute;
        right: -17px;
        bottom: -17px;
        width: 78px;
        height: 54px;
        border-radius: 70% 0 0;
        background: var(--bd-window-hill);
    }
    
    .bedroom__window-hill::before {
        content: "";
        position: absolute;
        right: 43px;
        bottom: 6px;
        width: 62px;
        height: 34px;
        border-radius: 50% 50% 0 0;
        background: var(--bd-window-hill);
    }
    
    .bedroom--dark .bedroom__sun {
        opacity: 0;
    }
    
    .bedroom--dark .bedroom__moon,
    .bedroom--dark .bedroom__window-star {
        opacity: 1;
    }
    
    .bedroom__clock {
        position: absolute;
        z-index: 2;
        top: 108px;
        left: 22px;
        width: 59px;
        height: 59px;
        border: 6px solid var(--bd-frame-main);
        border-radius: 50%;
        background: #FBF7EF;
        box-shadow: 0 6px 0 var(--bd-shadow-soft);
    }
    
    .bedroom__clock::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 3;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #E89A3C;
        transform: translate(-50%, -50%);
    }
    
    .bedroom__clock-hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        width: 4px;
        border-radius: 4px;
        background: #241E38;
        transform-origin: 50% 100%;
    }
    
    .bedroom__clock-hand--hour {
        height: 13px;
        transform: translateX(-50%) rotate(33deg);
    }
    
    .bedroom__clock-hand--minute {
        height: 18px;
        transform: translateX(-50%) rotate(122deg);
    }
    
    .bedroom__picture {
        position: absolute;
        z-index: 2;
        top: 101px;
        left: 108px;
        width: 86px;
        height: 73px;
        padding: 7px;
        border: 3px solid var(--bd-frame-main);
        border-radius: 8px;
        background: var(--bd-frame-lift);
        box-shadow: 0 7px 0 var(--bd-shadow-soft);
        transform: rotate(-2deg);
    }
    
    .bedroom__picture-art {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 3px;
        background: #E9E4F7;
    }
    
    .bedroom__picture-hill {
        position: absolute;
        right: -9px;
        bottom: -13px;
        width: 72px;
        height: 45px;
        border-radius: 60% 0 0;
        background: #4FBB91;
    }
    
    .bedroom__picture-paw {
        position: absolute;
