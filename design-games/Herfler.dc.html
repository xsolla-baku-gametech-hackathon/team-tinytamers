<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Hərf ovu */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;

      /* İSTİQAMƏT B — yumşaldılmış. Ailə adları və mənaları eynidir; yalnız xroma
      və səth parlaqlığı azalıb. Bütün mətn cütləri WCAG 4.5:1-dən yuxarıdadır. */
      --pp-primary: #6F5AD8;
      --pp-primary-dark: #54419E;
      --pp-primary-soft: #E9E4F7;
      --pp-primary-lift: #8A78E4;
      --pp-primary-edge: #4E3BA8;

      --pp-life: #35A57A;
      --pp-life-deep: #156F4F;
      --pp-life-soft: #DCEEE4;
      --pp-life-lift: #4FBB91;
      --pp-life-edge: #156F4F;
      --pp-on-life: #06301D;

      --pp-spark: #E89A3C;
      --pp-spark-deep: #93540E;
      --pp-spark-soft: #FAEBD6;
      --pp-spark-lift: #F2B166;
      --pp-spark-edge: #93540E;
      --pp-on-spark: #3A1D00;

      --pp-alert: #B7304C;
      --pp-alert-soft: #F7E1E5;
      --pp-alert-edge: #8A2038;

      --pp-bg: #F0EBE0;
      --pp-card: #FBF7EF;
      --pp-card-soft: #F6F1E6;
      --pp-glass: rgba(251, 247, 239, 0.94);

      --pp-ink: #241E38;
      --pp-ink-soft: #5C5470;
      --pp-ink-muted: #8A82A0;

      --pp-border: #E4DCCE;
      --pp-track: #E8E2D6;

      --pp-edge-neutral: rgba(96, 74, 46, 0.20);
      --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
      --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
      --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
      --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);

      /* Səhnə — süd kimi səma, sakit çəmən */
      --sc-sky-1: #BEDFEE;
      --sc-sky-2: #D3E9F1;
      --sc-sky-3: #E8F1E8;
      --sc-sun: #EFCE7C;
      --sc-sun-halo: #F5E3B4;
      --sc-cloud: #FBF8F2;
      --sc-hill-1: #CFE3D2;
      --sc-hill-2: #A5D3B7;
      --sc-hill-3: #77BE97;
      --sc-hill-4: #35A57A;
    }
    a { color: var(--pp-primary-dark); }
    a:hover { color: var(--pp-primary); }
  </style>
</helmet>
<div class="pp-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--pp-bg); color: var(--pp-ink);">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, var(--pp-primary-soft) 0%, var(--pp-bg) 44%, var(--pp-card-soft) 100%);"></div>

  <!-- Söz şəkildən gəlir, yazıdan yox: oxumağı hələ öyrənən uşaq da oynayır. -->
  <div style="position: absolute; top: 222px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; width: 208px; height: 152px; border-radius: 28px; background: var(--pp-card); box-shadow: 0 6px 0 var(--pp-edge-neutral), var(--pp-shadow-md); z-index: 10;">
    <svg viewBox="0 0 170 110" width="170" height="110" role="img" aria-label="Balıq">
      <ellipse cx="78" cy="55" rx="48" ry="31" fill="var(--pp-primary-lift)" />
      <path d="M126 55l30-21v42z" fill="var(--pp-primary)" />
      <path d="M70 24c8-10 22-10 30 0z" fill="var(--pp-primary)" />
      <circle cx="52" cy="46" r="7" fill="#FFF3E2" />
      <circle cx="50" cy="46" r="3.6" fill="#241E38" />
      <path d="M92 40q10 15 0 30M108 44q8 11 0 22" fill="none" stroke="var(--pp-primary-edge)" stroke-width="3" stroke-linecap="round" opacity="0.5" />
      <circle cx="24" cy="30" r="4" fill="#FFFFFF" opacity="0.7" />
      <circle cx="14" cy="44" r="2.6" fill="#FFFFFF" opacity="0.6" />
    </svg>
  </div>

  <!-- Söz yuvaları: dolan hərf yerində qalır, növbəti yuva döyünür. -->
  <div style="position: absolute; top: 398px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 10;">
    <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 66px; border-radius: 18px; background: linear-gradient(180deg, var(--pp-primary-lift) 0%, var(--pp-primary) 100%); box-shadow: 0 4px 0 var(--pp-primary-edge), var(--pp-gloss); font-size: 30px; font-weight: 900; color: #FFFFFF;">B</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 66px; border-radius: 18px; background: linear-gradient(180deg, var(--pp-primary-lift) 0%, var(--pp-primary) 100%); box-shadow: 0 4px 0 var(--pp-primary-edge), var(--pp-gloss); font-size: 30px; font-weight: 900; color: #FFFFFF;">A</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 66px; border-radius: 18px; background: linear-gradient(180deg, var(--pp-primary-lift) 0%, var(--pp-primary) 100%); box-shadow: 0 4px 0 var(--pp-primary-edge), var(--pp-gloss); font-size: 30px; font-weight: 900; color: #FFFFFF;">L</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 66px; border-radius: 18px; background: var(--pp-card); border: 3px solid var(--pp-primary); box-shadow: 0 4px 0 var(--pp-edge-neutral); font-size: 30px; font-weight: 900; color: var(--pp-primary);">?</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 66px; border-radius: 18px; background: var(--pp-card); border: 3px dashed var(--pp-border); font-size: 26px; font-weight: 900; color: var(--pp-ink-muted);"></span>
  </div>

  <!-- Hərf baloncuqları üzür: doğru hərf gizlənmir, sadəcə axının içindədir. -->
  <div style="position: absolute; top: 502px; left: 20px; right: 20px; bottom: 108px; z-index: 8;">

    <span style="position: absolute; left: 12px; top: 24px; display: flex; align-items: center; justify-content: center; width: 78px; height: 78px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 5px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 32px; font-weight: 900; color: var(--pp-ink);">I</span>

    <span style="position: absolute; right: 22px; top: 6px; display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 5px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 30px; font-weight: 900; color: var(--pp-ink);">M</span>

    <span style="position: absolute; left: 118px; top: 96px; display: flex; align-items: center; justify-content: center; width: 74px; height: 74px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 5px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 31px; font-weight: 900; color: var(--pp-ink);">Q</span>

    <span style="position: absolute; right: 34px; top: 118px; display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 999px; background: var(--pp-card); box-shadow: 0 5px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 29px; font-weight: 900; color: var(--pp-ink);">K</span>

    <!-- Basılan hərf: aşağı enir və kölgəsi azalır — barmağın altındakı cavab. -->
    <span style="position: absolute; left: 24px; top: 142px; display: flex; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 999px; background: var(--pp-primary-soft); box-shadow: 0 2px 0 var(--pp-edge-neutral); transform: translateY(3px); font-size: 30px; font-weight: 900; color: var(--pp-primary-dark);">A</span>
  </div>

  <!-- Pet sözü ucadan deyir: səs düyməsi həmişə eyni yerdədir. -->
  <div style="position: absolute; right: 16px; top: 250px; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss); z-index: 12;">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="var(--pp-primary)" stroke="var(--pp-primary-edge)" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M16 9.2a4.5 4.5 0 0 1 0 5.6M18.6 6.6a8 8 0 0 1 0 10.8" stroke="var(--pp-primary)" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </div>

  <div style="position: absolute; top: 52px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20;">

    <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; flex-shrink: 0; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="var(--pp-ink-soft)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 18px 8px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <span style="font-size: 14px; font-weight: 900; line-height: 1; color: var(--pp-ink);">Hərf ovu</span>
      <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg></div>
  </div>
  <div style="position: absolute; top: 122px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 8px 18px; border-radius: 22px; background: var(--pp-primary-soft); box-shadow: 0 3px 0 var(--pp-edge-neutral); text-align: center; z-index: 15;">
    <span style="font-size: 19px; font-weight: 900; line-height: 1.2; color: var(--pp-primary-dark);">Şəkildəki sözü yığ</span>
  </div>
  <div style="position: absolute; top: 190px; left: 20px; right: 20px; height: 8px; border-radius: 999px; background: var(--pp-track); overflow: hidden; z-index: 15;">
    <div style="width: 66%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pp-spark-lift) 0%, var(--pp-spark) 100%);"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-md), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <span style="font-size: 17px; font-weight: 900; color: var(--pp-ink);">3</span>
      <span style="font-size: 12px; font-weight: 800; color: var(--pp-ink-soft);">söz yığıldı</span>
    </div>
  </div>

</div>
</x-dc>
