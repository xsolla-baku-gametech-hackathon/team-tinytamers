<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Ulduz qaçışı */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;

      /* İSTİQAMƏT B — yumşaldılmış. Ailə adları və mənaları eynidir; yalnız xroma
      və səth parlaqlığı azalıb. Bütün mətn cütləri WCAG 4.5:1-dən yuxarıdadır. */
      --pp-primary: #6F5AD8;
      --pp-primary-dark: #54419E;
      --pp-primary-soft: #E9E4F7;
      --pp-primary-lift: #8A78E4;
      --pp-primary-edge: #4E3BA8;

      --pp-life: #35A57A;
      --pp-life-deep: #156F4F;
      --pp-life-soft: #DCEEE4;
      --pp-life-lift: #4FBB91;
      --pp-life-edge: #156F4F;
      --pp-on-life: #06301D;

      --pp-spark: #E89A3C;
      --pp-spark-deep: #93540E;
      --pp-spark-soft: #FAEBD6;
      --pp-spark-lift: #F2B166;
      --pp-spark-edge: #93540E;
      --pp-on-spark: #3A1D00;

      --pp-alert: #B7304C;
      --pp-alert-soft: #F7E1E5;
      --pp-alert-edge: #8A2038;

      --pp-bg: #F0EBE0;
      --pp-card: #FBF7EF;
      --pp-card-soft: #F6F1E6;
      --pp-glass: rgba(251, 247, 239, 0.94);

      --pp-ink: #241E38;
      --pp-ink-soft: #5C5470;
      --pp-ink-muted: #8A82A0;

      --pp-border: #E4DCCE;
      --pp-track: #E8E2D6;

      --pp-edge-neutral: rgba(96, 74, 46, 0.20);
      --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
      --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
      --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
      --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);

      /* Səhnə — süd kimi səma, sakit çəmən */
      --sc-sky-1: #BEDFEE;
      --sc-sky-2: #D3E9F1;
      --sc-sky-3: #E8F1E8;
      --sc-sun: #EFCE7C;
      --sc-sun-halo: #F5E3B4;
      --sc-cloud: #FBF8F2;
      --sc-hill-1: #CFE3D2;
      --sc-hill-2: #A5D3B7;
      --sc-hill-3: #77BE97;
      --sc-hill-4: #35A57A;
    }
    a { color: var(--pp-primary-dark); }
    a:hover { color: var(--pp-primary); }
  </style>
</helmet>
<div class="pp-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--sc-sky-2); color: var(--pp-ink);">

  <!-- Səhnə: səma, üfüq, təpələr. Oyun kartın içində deyil — ekranın özüdür. -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, var(--sc-sky-1) 0%, var(--sc-sky-2) 34%, var(--sc-sky-3) 100%);"></div>
  <div style="position: absolute; top: 236px; left: -40px; width: 220px; height: 90px; border-radius: 999px 999px 0 0; background: var(--sc-hill-1);"></div>
  <div style="position: absolute; top: 248px; right: -50px; width: 240px; height: 80px; border-radius: 999px 999px 0 0; background: var(--sc-hill-2);"></div>
  <div style="position: absolute; top: 296px; left: 0; right: 0; height: 548px; background: var(--sc-hill-1);"></div>

  <!-- Yol perspektivdə daralır: uzaqdakı qapı kiçikdir, deməli uşağın
       qərar verməyə vaxtı var. Zolaq xətləri hərəkət hissini daşıyır. -->
  <svg viewBox="0 0 390 548" width="390" height="548" style="position: absolute; top: 296px; left: 0;" aria-hidden="true">
    <path d="M150 0h90l190 548H-40z" fill="var(--pp-card-soft)" />
    <path d="M150 0h90l190 548H-40z" fill="none" stroke="var(--pp-card)" stroke-width="6" />

    <path d="M180 0L96 548" stroke="var(--pp-card)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 34" />
    <path d="M210 0L294 548" stroke="var(--pp-card)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 34" />

    <!-- Uzaqdakı qapı dəsti — hələ kiçikdir. -->

    <rect x="176" y="96" width="42" height="26" rx="10" fill="var(--pp-life)" opacity="0.5" />
    <rect x="224" y="96" width="48" height="26" rx="10" fill="var(--pp-primary)" opacity="0.5" />

    <!-- Yaxınlaşan dəst — oxunur, seçim İNDİ verilir. -->
    <rect x="52" y="208" width="94" height="52" rx="18" fill="var(--pp-alert)" stroke="var(--pp-alert-edge)" stroke-width="4" />
    <text x="99" y="243" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="900" fill="#FFFFFF">−4</text>

    <rect x="152" y="208" width="86" height="52" rx="18" fill="var(--pp-life)" stroke="var(--pp-life-edge)" stroke-width="4" />
    <text x="195" y="243" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="900" fill="#FFFFFF">×2</text>

    <rect x="244" y="208" width="94" height="52" rx="18" fill="var(--pp-primary)" stroke="var(--pp-primary-edge)" stroke-width="4" />
    <text x="291" y="243" text-anchor="middle" font-family="Nunito, sans-serif" font-size="27" font-weight="900" fill="#FFFFFF">+3</text>

    <!-- Yolda yığılan ulduzlar. -->
    <path d="M118 320l4.6 9.8 10.8 1.4-8 7.4 2.2 10.6-9.6-5.3-9.6 5.3 2.2-10.6-8-7.4 10.8-1.4z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="2" stroke-linejoin="round" />
    <path d="M286 356l4.2 8.9 9.8 1.3-7.3 6.7 2 9.6-8.7-4.8-8.7 4.8 2-9.6-7.3-6.7 9.8-1.3z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="2" stroke-linejoin="round" />
    <path d="M196 296l3.6 7.6 8.4 1.1-6.2 5.7 1.7 8.2-7.5-4.1-7.5 4.1 1.7-8.2-6.2-5.7 8.4-1.1z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="1.8" stroke-linejoin="round" />
  </svg>

  <!-- Pet orta zolaqdadır; sürət cizgiləri onun arxasından qalır. -->
  <div style="position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); z-index: 6;">
    <svg viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="Aylinin pet-i">
      <ellipse cx="100" cy="168" rx="43.24" ry="9" fill="rgba(0,0,0,0.12)" />
      <g transform="translate(100 162) scale(0.94) translate(-100 -162)">
        <path d="M132 132c22 4 34-10 34-26 0-12-7-22-16-24 4 10 2 22-6 29-7 6-15 8-22 8z" fill="#F3A05A" />
        <ellipse cx="100" cy="128" rx="38" ry="34" fill="#F3A05A" />
        <ellipse cx="100" cy="136" rx="24" ry="23" fill="#FFF3E2" />
        <ellipse cx="80" cy="158" rx="13" ry="8" fill="#FFF3E2" />
        <ellipse cx="120" cy="158" rx="13" ry="8" fill="#FFF3E2" />
        <path d="M64 60l-6-30 28 16z" fill="#F3A05A" />
        <path d="M136 60l6-30-28 16z" fill="#F3A05A" />
        <path d="M67 57l-3-17 16 9z" fill="#FFD3A8" />
        <path d="M133 57l3-17-16 9z" fill="#FFD3A8" />
        <ellipse cx="100" cy="74" rx="36" ry="32" fill="#F3A05A" />
        <ellipse cx="100" cy="86" rx="26" ry="18" fill="#FFF3E2" />
        <path d="M78 74q8 -11 16 0" stroke="#2B2140" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M106 74q8 -11 16 0" stroke="#2B2140" stroke-width="5" fill="none" stroke-linecap="round" />
        <ellipse cx="100" cy="84" rx="6" ry="4.5" fill="#2B2140" />
        <path d="M92 92q8 9 16 0" stroke="#2B2140" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <ellipse cx="72" cy="86" rx="7" ry="4.5" fill="#FF9EA8" opacity="0.65" /><ellipse cx="128" cy="86" rx="7" ry="4.5" fill="#FF9EA8" opacity="0.65" />
        <path d="M76 100q24 14 48 0" stroke="var(--pp-primary)" stroke-width="7" fill="none" stroke-linecap="round" />
        <circle cx="100" cy="110" r="7" fill="var(--pp-spark)" stroke="var(--pp-spark-deep)" stroke-width="2" />
        
      </g>
    </svg>
  </div>
  <svg viewBox="0 0 120 60" width="120" height="60" style="position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); z-index: 5;" aria-hidden="true">
    <path d="M14 18h26M8 34h20M84 18h26M92 34h20" stroke="var(--pp-card)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  </svg>

  <!-- Zolağı dəyişmək: ekranın sol və sağ yarısına toxunmaq. İşarə səhnənin
       üstündə qalır ki, uşaq nə edəcəyini axtarmasın. -->
  <div style="position: absolute; left: 18px; bottom: 106px; display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss); z-index: 8;">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" aria-hidden="true">
      <path d="M14 5l-7 7 7 7" stroke="var(--pp-primary-dark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <div style="position: absolute; right: 18px; bottom: 106px; display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss); z-index: 8;">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" aria-hidden="true">
      <path d="M10 5l7 7-7 7" stroke="var(--pp-primary-dark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <div style="position: absolute; top: 52px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20;">

    <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; flex-shrink: 0; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="var(--pp-ink-soft)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 18px 8px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <span style="font-size: 14px; font-weight: 900; line-height: 1; color: var(--pp-ink);">Ulduz qaçışı</span>
      <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg></div>
  </div>
  <div style="position: absolute; top: 122px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 8px 18px; border-radius: 22px; background: var(--pp-spark-soft); box-shadow: 0 3px 0 var(--pp-edge-neutral); text-align: center; z-index: 15;">
    <span style="font-size: 19px; font-weight: 900; line-height: 1.2; color: var(--pp-spark-deep);">Ən çox ulduz gətirən qapıdan keç</span>
  </div>
  <div style="position: absolute; top: 190px; left: 20px; right: 20px; height: 8px; border-radius: 999px; background: var(--pp-track); overflow: hidden; z-index: 15;">
    <div style="width: 64%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pp-spark-lift) 0%, var(--pp-spark) 100%);"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-md), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <span style="font-size: 17px; font-weight: 900; color: var(--pp-ink);">18</span>
      <span style="font-size: 12px; font-weight: 800; color: var(--pp-ink-soft);">ulduz yığıldı</span>
    </div>
  </div>

</div>
