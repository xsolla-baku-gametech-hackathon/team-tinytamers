<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap">
  <style>
    /* Meyvə kəs */
    body {
      margin: 0;
      font-family: 'Nunito', ui-rounded, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;

      /* İSTİQAMƏT B — yumşaldılmış. Ailə adları və mənaları eynidir; yalnız xroma
      və səth parlaqlığı azalıb. Bütün mətn cütləri WCAG 4.5:1-dən yuxarıdadır. */
      --pp-primary: #6F5AD8;
      --pp-primary-dark: #54419E;
      --pp-primary-soft: #E9E4F7;
      --pp-primary-lift: #8A78E4;
      --pp-primary-edge: #4E3BA8;

      --pp-life: #35A57A;
      --pp-life-deep: #156F4F;
      --pp-life-soft: #DCEEE4;
      --pp-life-lift: #4FBB91;
      --pp-life-edge: #156F4F;
      --pp-on-life: #06301D;

      --pp-spark: #E89A3C;
      --pp-spark-deep: #93540E;
      --pp-spark-soft: #FAEBD6;
      --pp-spark-lift: #F2B166;
      --pp-spark-edge: #93540E;
      --pp-on-spark: #3A1D00;

      --pp-alert: #B7304C;
      --pp-alert-soft: #F7E1E5;
      --pp-alert-edge: #8A2038;

      --pp-bg: #F0EBE0;
      --pp-card: #FBF7EF;
      --pp-card-soft: #F6F1E6;
      --pp-glass: rgba(251, 247, 239, 0.94);

      --pp-ink: #241E38;
      --pp-ink-soft: #5C5470;
      --pp-ink-muted: #8A82A0;

      --pp-border: #E4DCCE;
      --pp-track: #E8E2D6;

      --pp-edge-neutral: rgba(96, 74, 46, 0.20);
      --pp-shadow-sm: 0 2px 8px rgba(96, 74, 46, 0.10);
      --pp-shadow-md: 0 8px 24px rgba(96, 74, 46, 0.13);
      --pp-shadow-lg: 0 16px 40px rgba(96, 74, 46, 0.18);
      --pp-gloss: inset 0 2px 0 rgba(255, 255, 255, 0.40);

      /* Səhnə — süd kimi səma, sakit çəmən */
      --sc-sky-1: #BEDFEE;
      --sc-sky-2: #D3E9F1;
      --sc-sky-3: #E8F1E8;
      --sc-sun: #EFCE7C;
      --sc-sun-halo: #F5E3B4;
      --sc-cloud: #FBF8F2;
      --sc-hill-1: #CFE3D2;
      --sc-hill-2: #A5D3B7;
      --sc-hill-3: #77BE97;
      --sc-hill-4: #35A57A;
    }
    a { color: var(--pp-primary-dark); }
    a:hover { color: var(--pp-primary); }
  </style>
</helmet>
<div class="pp-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--pp-card-soft); color: var(--pp-ink);">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, var(--pp-alert-soft) 0%, var(--pp-card-soft) 46%, var(--pp-card) 100%);"></div>

  <!-- Hədəf lövhəsi: uşaq nə YIĞDIĞINI və nə QALDIĞINI eyni anda görür. -->
  <div style="position: absolute; top: 214px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 12;">
    <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 18px; background: var(--pp-card); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 24px; font-weight: 900; color: var(--pp-alert);">4</div>
    <span style="font-size: 22px; font-weight: 900; color: var(--pp-ink-muted);">+</span>
    <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 18px; background: var(--pp-card); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm); font-size: 24px; font-weight: 900; color: var(--pp-spark-deep);">3</div>
    <span style="font-size: 22px; font-weight: 900; color: var(--pp-ink-muted);">+</span>
    <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 18px; border: 3px dashed var(--pp-border); font-size: 22px; font-weight: 900; color: var(--pp-ink-muted);">?</div>
    <span style="font-size: 22px; font-weight: 900; color: var(--pp-ink-muted);">=</span>
    <div style="display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 20px; background: linear-gradient(180deg, var(--pp-alert-lift) 0%, var(--pp-alert) 100%); box-shadow: 0 4px 0 var(--pp-alert-edge), var(--pp-gloss); font-size: 26px; font-weight: 900; color: #FFFFFF;">10</div>
  </div>

  <!-- Səhnə: meyvələr havaya atılır, biri elə indi kəsilir. Bomba qaydadan
       kənardır — ona toxunmaq bir cana başa gəlir. -->
  <svg viewBox="0 0 390 520" width="390" height="520" style="position: absolute; top: 290px; left: 0;" aria-hidden="true">

    <!-- Kəsilmiş meyvə: iki yarım, aralarında kəsik üzü və şirə damcıları. -->
    <g>
      <path d="M104 128a44 44 0 0 1 0-88z" fill="var(--pp-alert)" transform="translate(-14 0)" />
      <path d="M90 40a44 44 0 0 1 0 88z" fill="var(--pp-alert)" transform="translate(16 0)" />
      <path d="M90 46a38 38 0 0 0 0 76z" fill="#FFE7EC" transform="translate(-14 0)" />
      <path d="M90 46a38 38 0 0 1 0 76z" fill="#FFE7EC" transform="translate(16 0)" />
      <circle cx="70" cy="84" r="5" fill="var(--pp-alert)" opacity="0.35" />
      <circle cx="118" cy="84" r="5" fill="var(--pp-alert)" opacity="0.35" />
      <circle cx="94" cy="150" r="5" fill="var(--pp-alert)" opacity="0.55" />
      <circle cx="112" cy="168" r="3.4" fill="var(--pp-alert)" opacity="0.45" />
      <circle cx="78" cy="166" r="3" fill="var(--pp-alert)" opacity="0.45" />
      <text x="72" y="94" text-anchor="middle" font-family="Nunito, sans-serif" font-size="30" font-weight="900" fill="var(--pp-alert)">6</text>
    </g>

    <!-- Bütöv meyvələr: rəqəm meyvənin üstündədir, ayrıca yazı yoxdur. -->
    <g>
      <circle cx="248" cy="70" r="42" fill="var(--pp-spark)" />
      <circle cx="234" cy="54" r="11" fill="#FFFFFF" opacity="0.35" />
      <path d="M248 28c4-12 14-16 22-14-2 10-10 15-22 14z" fill="var(--pp-life)" />
      <text x="248" y="84" text-anchor="middle" font-family="Nunito, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">7</text>
    </g>

    <g>
      <circle cx="322" cy="228" r="36" fill="var(--pp-life)" />
      <circle cx="310" cy="214" r="9" fill="#FFFFFF" opacity="0.32" />
      <text x="322" y="241" text-anchor="middle" font-family="Nunito, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">3</text>
    </g>

    <g>
      <circle cx="86" cy="292" r="38" fill="var(--pp-primary)" />
      <circle cx="74" cy="276" r="10" fill="#FFFFFF" opacity="0.3" />
      <text x="86" y="306" text-anchor="middle" font-family="Nunito, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">9</text>
    </g>

    <!-- Bomba: forma da, rəng də fərqlidir — rəngi seçməyən uşaq da tanıyır. -->
    <g>
      <circle cx="216" cy="336" r="34" fill="#3A3350" />
      <circle cx="204" cy="322" r="8" fill="#FFFFFF" opacity="0.22" />
      <path d="M228 306c8-10 18-10 22-2" fill="none" stroke="#8A82A0" stroke-width="5" stroke-linecap="round" />
      <path d="M252 300l3.4 7.2 7.8 1-5.7 5.5 1.4 7.8-6.9-3.7-6.9 3.7 1.4-7.8-5.7-5.5 7.8-1z" fill="var(--pp-spark)" />
    </g>

    <!-- Kəsik izi: barmağın yolu. Meyvənin arasından KEÇİR, üstündən yox. -->
    <path d="M18 208C104 150 168 176 240 118" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.75" />
    <path d="M18 208C104 150 168 176 240 118" fill="none" stroke="var(--pp-alert)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.6" />
  </svg>

  <div style="position: absolute; top: 52px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20;">

    <span style="display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; flex-shrink: 0; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" stroke="var(--pp-ink-soft)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 18px 8px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);">
      <span style="font-size: 14px; font-weight: 900; line-height: 1; color: var(--pp-ink);">Meyvə kəs</span>
      <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-primary);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: var(--pp-track);"></span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-sm), var(--pp-gloss);"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-alert)" /></svg><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.6C12 20.6 3.8 15.6 3.8 10.1A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8.2 2.8c0 5.5-8.2 10.5-8.2 10.5z" fill="var(--pp-track)" /></svg></div>
  </div>
  <div style="position: absolute; top: 122px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 8px 18px; border-radius: 22px; background: var(--pp-alert-soft); box-shadow: 0 3px 0 var(--pp-edge-neutral); text-align: center; z-index: 15;">
    <span style="font-size: 19px; font-weight: 900; line-height: 1.2; color: var(--pp-alert-deep);">Cəmi 10 edən meyvələri kəs</span>
  </div>
  <div style="position: absolute; top: 190px; left: 20px; right: 20px; height: 8px; border-radius: 999px; background: var(--pp-track); overflow: hidden; z-index: 15;">
    <div style="width: 41%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pp-spark-lift) 0%, var(--pp-spark) 100%);"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 20px; border-radius: 999px; background: var(--pp-glass); box-shadow: 0 3px 0 var(--pp-edge-neutral), var(--pp-shadow-md), var(--pp-gloss);">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z" fill="var(--pp-spark)" stroke="var(--pp-spark-edge)" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
      <span style="font-size: 17px; font-weight: 900; color: var(--pp-ink);">2</span>
      <span style="font-size: 12px; font-weight: 800; color: var(--pp-ink-soft);">cəm tamamlandı</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
