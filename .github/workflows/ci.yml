name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  api-and-tests:
    name: API + testlər
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # MAUI host layihəsi bu job-da qurulmur (Android workload tələb edir),
      # ona görə layihələr ayrı-ayrı restore/build olunur.
      - name: Restore
        run: |
          dotnet restore src/PetPal.Shared/PetPal.Shared.csproj
          dotnet restore src/PetPal.Api/PetPal.Api.csproj
          dotnet restore src/PetPal.App.Ui/PetPal.App.Ui.csproj
          dotnet restore src/PetPal.Web/PetPal.Web.csproj
          dotnet restore tests/PetPal.Tests/PetPal.Tests.csproj
          dotnet restore tests/PetPal.App.Tests/PetPal.App.Tests.csproj

      - name: Build
        run: |
          dotnet build src/PetPal.Api/PetPal.Api.csproj -c Release --no-restore
          dotnet build src/PetPal.App.Ui/PetPal.App.Ui.csproj -c Release --no-restore
          dotnet build src/PetPal.Web/PetPal.Web.csproj -c Release --no-restore

      - name: Test (API)
        run: dotnet test tests/PetPal.Tests/PetPal.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=api.trx"

      - name: Test (App UI)
        run: dotnet test tests/PetPal.App.Tests/PetPal.App.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=app.trx"

      - name: Test nəticələrini yüklə
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  android:
    name: Android build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: MAUI workload
        run: dotnet workload install maui-android --skip-sign-check

      # Qeyd: aapt2 ASCII olmayan yolları emal edə bilmir (APT2265).
      # GitHub runner-in iş qovluğu ASCII-dir, ona görə burada problem yoxdur.
      - name: Build
        run: dotnet build src/PetPal.App/PetPal.App.csproj -f net10.0-android -c Release

  ios:
    name: iOS build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: MAUI workload
        run: dotnet workload install maui-ios --skip-sign-check

      - name: Build
        run: dotnet build src/PetPal.App/PetPal.App.csproj -f net10.0-ios -c Release
